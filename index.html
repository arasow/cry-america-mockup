function routeStatus(r) {
  if (!r.route) return ['Built', 'Global component (header, footer, quick-give panel, 404)'];
  if (BUILT[r.id]) return ['Built', `Stage ${r.stage}`];
  if (r.priority !== 'MVP') return ['Phase 2 placeholder', 'Heading and one-line description; navigation never dead-ends'];
  return ['Not built', `Stage ${r.stage}`];
}
function routeChecklist() {
  const rows = SITEMAP.map((r) => [r, ...routeStatus(r)]);
  const n = (s) => rows.filter((x) => x[1] === s).length;
  return `<p class="muted">${n('Built')} built · ${n('Phase 2 placeholder')} Phase 2 placeholders · ${n('Not built')} not built · ${SITEMAP.length} rows</p>
  <div class="table-wrap table-wrap--scroll" tabindex="0" role="region" aria-label="Route checklist (scrollable)"><table class="table" data-route-table><thead><tr><th scope="col">ID</th><th scope="col">Page</th><th scope="col">Route</th><th scope="col">Access</th><th scope="col">Status</th><th scope="col">Notes</th></tr></thead>
  <tbody>${rows.map(([r, st, note]) => `<tr><td><code>${esc(r.id)}</code></td><td>${esc(r.title)}</td><td>${r.route ? `<code>#${esc(r.route)}</code>${(r.aliases || []).map((a) => `<br><code>#${esc(a)}</code>`).join('')}` : '—'}</td><td>${esc(r.access.replace(/\s*\(.*\)/, ''))}</td><td>${st === 'Built' ? '<span class="status status--live">Built</span>' : st === 'Not built' ? '<span class="status status--returned">Not built</span>' : '<span class="status status--draft">Phase 2</span>'}</td><td>${esc(note)}${r.legacyUrl ? `<br><small class="muted">Was ${esc(r.legacyUrl)}</small>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
}

/* ---------- 6. Router + interactions ---------- */
/* Param resolvers: a template route only matches when its entity exists, so bad slugs go to the 404 page. */
const RESOLVE = {
  category: (v) => catOf(v),
  event: (v, p) => eventOf(v),
  gala: (v) => { const e = eventOf(v); return e && e.cat === 'gala' ? e : null; },
  page: (v, p) => { const f = fundOf(v); return f && f.type === 'personal' && f.event === p.event ? f : null; },
  occasion: (v) => { const f = fundOf(v); return f && f.type === 'occasion' ? f : null; },
  team: (v, p) => { const t = teamOf(v); return t && (!p.event || t.event === p.event) ? t : null; },
  project: (v) => projectOf(v),
  city: (v) => acOf(v),
  article: (v) => DATA.articles.find((x) => x.slug === v),
  focus: (v) => focusOf(v),
  campaign: (v) => DATA.campaigns.find((c) => c.slug === v && c.landing !== false),
  topic: (v) => v, job: (v) => v, story: (v) => v, id: (v) => v,
};
/* Pages built so far (by sitemap ID). Everything else renders the "not built yet" or Phase 2 placeholder. */
const BUILT = {
  'HA-01': () => pageHome(),
  'G-04': () => pageSearch(),
  'HA-02': () => pageAbout(), 'HA-03': () => pageTeam(), 'HA-04': () => pageFinancials(), 'HA-10': () => pageContact(), 'HA-11': () => pageFaqs(),
  'OW-01': () => pageOurWork(), 'OW-02': (p) => pageFocus(p), 'OW-03': () => pageImpact(), 'OW-04': () => pageHowWeFund(), 'OW-05': () => pageProjects(), 'OW-06': (p) => pageProject(p),

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const open = document.querySelector('[data-action="toggle-mega"][aria-expanded="true"], [data-action="toggle-acct"][aria-expanded="true"]');
    if (open) { closeMenus(); open.focus(); }
  }
  const tab = e.target.closest('[role="tab"]');
  if (tab && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) {
    const list = [...tab.parentElement.querySelectorAll('[role="tab"]')];
    let i = list.indexOf(tab);
    i = e.key === 'Home' ? 0 : e.key === 'End' ? list.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + list.length) % list.length;
    list[i].click(); list[i].focus(); e.preventDefault();
  }
});
document.addEventListener('click', (e) => {
  const tab = e.target.closest('[role="tab"]');
  if (!tab) return;
  const list = [...tab.parentElement.querySelectorAll('[role="tab"]')];
  list.forEach((t) => { const on = t === tab; t.setAttribute('aria-selected', on); t.tabIndex = on ? 0 : -1; document.getElementById(t.getAttribute('aria-controls')).hidden = !on; });
});
function handleUpload(input, files) {
  const box = input.closest('[data-upload]');
  const max = +box.dataset.max;
  const prev = box.querySelector('.upload__previews');
  const err = box.querySelector('.field__error');
  const have = prev.children.length;
  const images = files.filter((f) => f.type.startsWith('image/'));
  let msg = '';
  if (images.length < files.length) msg = 'Only image files can be added.';
  if (have + images.length > max) msg = `You can add up to ${max} photos. Remove one to add another.`;
  err.hidden = !msg; err.innerHTML = msg ? icon('x-circle', 'icon--sm') + esc(msg) : '';
  images.slice(0, Math.max(0, max - have)).forEach((file) => {
    const rd = new FileReader();
    rd.onload = () => {
      const d = document.createElement('div');
      d.className = 'upload__thumb';
      d.innerHTML = `<figure class="media"><img src="${rd.result}" alt="Preview of ${esc(file.name)}"></figure><button type="button" aria-label="Remove ${esc(file.name)}">${icon('x', 'icon--sm')}</button>`;
      d.querySelector('button').onclick = () => { d.remove(); err.hidden = true; };
      prev.appendChild(d);
    };
    rd.readAsDataURL(file);
  });
  input.value = '';
}

    <section aria-labelledby="ad-log"><h2 id="ad-log">Audit log</h2>${DATA.audit.length ? `<div class="table-wrap"><table class="table"><thead><tr><th scope="col">When</th><th scope="col">Who</th><th scope="col">Action</th><th scope="col">Item</th><th scope="col">Note</th></tr></thead><tbody>${DATA.audit.slice(0, 20).map((a) => `<tr><td>${fmtDate(a.when, { month: 'short', day: 'numeric' })}</td><td>${esc(a.who)}</td><td>${esc(a.action)}</td><td>${esc(a.target)}</td><td>${esc(a.note)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">No actions yet this session.</p>'}</section>

/* Apply an approval decision. Approving a new event publishes it. */
function decide(key, approve, note) {
  const [kind, id] = key.split(':');
  if (kind === 'draft') {
    const d = draftOf(id);
    if (!approve) { d.status = 'returned'; d.comment = note; audit('Returned event', d.title, note); return; }
    if (d.editOf) {
      const e = eventOf(d.editOf);
      Object.assign(e, { title: d.title, date: d.date, time: d.time, venue: d.venue, city: d.city, goal: d.goal, fundraising: d.fundraising });
      if (e.cat !== 'gala') DATA.tickets[e.slug] = d.tickets.map((t, i) => ({ ...t, sold: (ticketsOf(e)[i] || {}).sold || 0 }));
    } else {
      const slug = slugify(d.title);
      const prices = d.tickets.map((t) => t.price);
      DATA.events.push({ slug, title: d.title, cat: d.cat, ac: d.ac, date: d.date, time: d.time, venue: d.venue, city: d.city, price: [Math.min(...prices), Math.max(...prices)], goal: d.goal, img: null, fundraising: d.fundraising, questions: d.questions, waiver: d.waiver, shifts: d.shifts, status: 'live' });
      DATA.tickets[slug] = d.tickets.map((t) => ({ ...t, sold: 0 }));
      d.published = slug;
    }
    d.status = 'approved'; audit('Approved event', d.title, note);
    DATA.eventDrafts.splice(DATA.eventDrafts.indexOf(d), 1);
  } else if (kind === 'sponsor') {
    const s = DATA.sponsorships.find((x) => x.id === id); s.status = approve ? 'approved' : 'returned'; audit(approve ? 'Approved sponsor logo' : 'Returned sponsor logo', s.company, note);
  } else if (kind === 'ac') {
    const x = DATA.acEdits.find((y) => y.id === id); x.status = approve ? 'approved' : 'returned'; if (approve) { const ac = acOf(x.ac); ac.about = x.about; if (x.officers) ac.officers = x.officers; } audit(approve ? 'Approved Action Center page' : 'Returned Action Center page', acOf(x.ac).name, note);
  } else if (kind === 'page') {
    const f = fundOf(id); if (approve) f.moderation = 'approved'; else { f.moderation = 'returned'; f.status = 'draft'; f.modNote = note; } audit(approve ? 'Approved fundraising page' : 'Unpublished fundraising page', f.title, note);
  }
}

/* ASA-02 Fundraising page moderation */
function pageModeration() {

function shiftTable(rows) {

/* =====================================================================
   Stage 4 · Events: hub, category hubs, event page, gala variant (dark),
   registration + confirmation, pledge, sponsor, volunteer shifts.
   Rules: no text on event photos; meters only with a goal; Walk and Gala
   show combined all-city totals, local categories only per-event meters.
   ===================================================================== */
const canFundraise = (e) => !!e.fundraising && !isPast(e.date);
const ticketsOf = (e) => (e.cat === 'gala' ? DATA.galaTickets : DATA.tickets[e.slug] || []);
const remaining = (e, t) => Math.max(0, t.cap - t.sold - ((STATE.sold || {})[e.slug + ':' + t.id] || 0));
const toMin = (t) => { const m = /(\d+):(\d+)\s*(am|pm)/i.exec(t); let h = +m[1] % 12; if (/pm/i.test(m[3])) h += 12; return h * 60 + +m[2]; };
const fmtMin = (n) => { n = ((Math.round(n) % 1440) + 1440) % 1440; const h = Math.floor(n / 60), m = n % 60; return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')} ${h < 12 ? 'am' : 'pm'}`; };
function shiftsOf(e) {
  const start = toMin(e.time);
  if (e.shifts && e.shifts.length) return e.shifts.map(([role, from, to, cap], i) => { const id = `${e.slug}-c${i}`; const filled = Math.min(cap, (STATE.shiftSignups || {})[id] || 0); return { id, role, from, to, cap, filled, left: cap - filled }; });
  return (DATA.shiftTemplates[e.cat] || []).map(([role, off, len, cap], i) => {
    const id = `${e.slug}-s${i}`;
    const filled = Math.min(cap, (hashCode(id) % (cap + 1)) + ((STATE.shiftSignups || {})[id] || 0));
    return { id, role, from: fmtMin(start + off * 60), to: fmtMin(start + (off + len) * 60), cap, filled, left: cap - filled };
  });
}
const priceLabel = (e) => (e.price[1] === 0 ? 'Free' : e.price[0] === e.price[1] ? money(e.price[0]) : `${e.price[0] === 0 ? 'Free' : money(e.price[0])} – ${money(e.price[1])}`);
const calLink = (e) => `data:text/calendar;charset=utf-8,${encodeURIComponent(`BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nSUMMARY:${e.title}\nDTSTART:${e.date.replace(/-/g, '')}\nLOCATION:${e.venue}, ${e.city}\nEND:VEVENT\nEND:VCALENDAR`)}`;

const US = [[-124.7,48.4],[-124.6,46.3],[-124.1,43.4],[-124.4,42],[-124.2,40.4],[-123.7,38.9],[-122.5,37.7],[-121.9,36.6],[-120.6,34.6],[-118.5,34],[-117.1,32.5],[-114.7,32.7],[-111,31.3],[-108.2,31.3],[-106.5,31.8],[-104.5,29.6],[-103,29],[-101.4,29.8],[-99.5,27.5],[-97.2,25.9],[-97.4,27.8],[-94.8,29.3],[-93.8,29.7],[-91,29.2],[-89.4,29],[-89.6,30.2],[-88,30.4],[-86.5,30.4],[-85,29.7],[-83.7,29.9],[-82.8,28.2],[-81.8,26.1],[-80.9,25.2],[-80.1,25.8],[-80.1,26.9],[-80.6,28.4],[-81.3,30.4],[-81.2,31.7],[-80.5,32.5],[-79.2,33.2],[-77.9,33.9],[-76.5,34.7],[-75.5,35.3],[-75.9,36.9],[-76.3,38],[-75.1,38.8],[-74.4,39.4],[-74,40.5],[-72.5,41.2],[-70.7,41.5],[-70,41.8],[-70.6,42.6],[-70.8,43.1],[-70.2,43.7],[-68.8,44.4],[-67,44.8],[-67.8,47.1],[-69.2,47.4],[-70.9,45.2],[-74.7,45],[-76.3,44.2],[-79.1,43.3],[-79,42.8],[-82.5,41.7],[-83.2,42.1],[-82.4,43],[-82.5,45.3],[-84.5,46.4],[-88.4,48.3],[-89.6,48],[-95.2,49],[-123,49]];
const proj = ([lon, lat]) => [(lon + 125) * 10, (50 - lat) * 12.5];
function usMap(events) {

/* E-02 Category hub */
function pageCategory(params) {
  const c = catOf(params.category);
  const year = Number(TODAY.slice(0, 4));
  const evs = DATA.events.filter((e) => e.cat === c.slug);
  const up = evs.filter((e) => !isPast(e.date)).sort((a, b) => a.date.localeCompare(b.date));
  const past = evs.filter((e) => isPast(e.date)).sort((a, b) => b.date.localeCompare(a.date));
  const pages = DATA.fundraisers.filter((f) => f.type === 'personal' && evs.some((e) => e.slug === f.event));

      <div class="ds-grid-2"><div class="give-card">${leaderboard(pages.map((f) => ({ name: f.owner, sub: f.team ? 'Team ' + teamOf(f.team).name : 'Individual', amount: ROLLUP.fundraiser(f), href: hrefFund(f) })).sort((a, b) => b.amount - a.amount).slice(0, 5))}</div>
      <div class="stack">${teams.map(cardTeam).join('')}${canFundraise(e) ? btn('Create a team', { variant: 'tertiary', href: `#/events/${e.slug}/teams/new`, icon: 'plus' }) : ''}</div></div></section>` : ''}
    ${dons.length ? `<section aria-labelledby="ev-don"><h2 id="ev-don">Donors</h2>${donorTable(dons, { caption: `Gifts to ${e.title}` })}</section>` : ''}
    <section aria-labelledby="ev-sp"><div class="section-head"><div><h2 id="ev-sp">Sponsors</h2><p>Thank you to the businesses that make this event possible.</p></div><div class="cluster">${isPast(e.date) ? '' : btn('Become a sponsor', { variant: 'secondary', href: `#/events/${e.slug}/sponsor` })}${btn('Pay a sponsorship', { variant: 'secondary', icon: 'lock', href: `#/events/${e.slug}/sponsor?pay=1` })}</div></div>${logoStrip(sponsors.map(([tier, names]) => ({ tier, names })))}</section>

  <section aria-labelledby="gl-com"><h2 id="gl-com">Gala committee</h2><div class="grid" style="--min:160px">${G.committee.map(([n, r]) => personCard({ name: n, role: r })).join('')}</div><p class="muted"><small>Committee names are placeholders.</small></p></section>
  <section aria-labelledby="gl-last"><h2 id="gl-last">Last year’s gala</h2><div class="stat-row">${statTile({ icon: 'heart', num: '—', label: 'Raised in 2025 (migrates from last year’s page)' })}${statTile({ icon: 'users', num: '—', label: 'Guests in 2025' })}</div></section>

/* Payment element (mock Stripe): card shows number, expiry, CVC and ZIP; ACH links a bank; wallets show their buttons. */
function paymentFields(method, p) {
  if (method === 'ach') return `<span class="eyebrow">${icon('lock', 'icon--sm')} Bank account via Stripe (mock)</span><p class="muted">You will sign in to your bank in a secure Stripe window. Payments by ACH take 3–5 business days to clear.</p>${btn('Connect bank account', { variant: 'secondary', icon: 'lock', attrs: 'data-action="mock-connect"' })}`;
  if (method === 'wallet') return `<span class="eyebrow">${icon('lock', 'icon--sm')} Digital wallet (mock)</span><p class="muted">Confirm with Face ID, Touch ID or your phone. Your card details are not shared with CRY America.</p><div class="cluster">${btn('Apple Pay', { variant: 'secondary', attrs: 'data-action="mock-connect" aria-label="Pay with Apple Pay"' })}${btn('Google Pay', { variant: 'secondary', attrs: 'data-action="mock-connect" aria-label="Pay with Google Pay"' })}</div>`;
  return `<span class="eyebrow">${icon('lock', 'icon--sm')} Card via Stripe (mock)</span>${field({ id: p + '-card', label: 'Card number', placeholder: '1234 1234 1234 1234', attrs: 'inputmode="numeric" autocomplete="off"' })}<div class="field-row">${field({ id: p + '-exp', label: 'Expiry', placeholder: 'MM / YY', attrs: 'autocomplete="off"' })}${field({ id: p + '-cvc', label: 'CVC', placeholder: '123', attrs: 'inputmode="numeric" autocomplete="off"' })}${field({ id: p + '-zip', label: 'Billing ZIP', placeholder: '77001', attrs: 'inputmode="numeric" autocomplete="off"' })}</div>`;
}

/* E-05 Registration (5 steps) + E-06 confirmation */
const REG_STEPS = ['Tickets', 'Attendees', 'Waiver', 'Give & fundraise', 'Payment'];
function regState(e) {
  if (!STATE.reg || STATE.reg.event !== e.slug) STATE.reg = { event: e.slug, step: 0, qty: {}, attendees: [], waiver: false, signer: '', donation: 0, donationOther: '', fundraise: 'none', team: '', teamName: '', method: 'card' };
  return STATE.reg;
}
function regLines(e) { const r = STATE.reg; return ticketsOf(e).filter((t) => r.qty[t.id]).map((t) => ({ t, n: r.qty[t.id], total: t.price * r.qty[t.id], ndp: (t.ndp || 0) * r.qty[t.id], seats: t.seats * r.qty[t.id] })); }
function regTotals(e) { const L = regLines(e); const r = STATE.reg; const don = r.donationOther ? parseFloat(r.donationOther) || 0 : r.donation; const tickets = L.reduce((a, l) => a + l.total, 0); return { L, tickets, ndp: L.reduce((a, l) => a + l.ndp, 0), seats: L.reduce((a, l) => a + l.seats, 0), donation: don, total: tickets + don }; }
function myPageFor(e) { return STATE.role !== 'visitor' && DATA.fundraisers.find((f) => f.event === e.slug && f.owner === `${DATA.me.first} ${DATA.me.last}`); }
function pageRegister(params) {
  const e = eventOf(params.event);
  const c = catOf(e.cat);
  if (isPast(e.date)) return `<div class="wrap"><div class="notice-page"><span class="notice-page__ico">${icon('calendar')}</span><h1>Registration is closed</h1><p class="lead">${esc(e.title)} took place on ${fmtDate(e.date)}.</p>${btn('See upcoming events', { href: '#/events' })}</div></div>`;
  regState(e);
  return `<div class="${e.cat === 'gala' ? 'gala-page' : ''}"><div class="wrap section--tight">${breadcrumbs([['Home', '#/'], ['Events', '#/events'], [e.title, hrefEvent(e)], [c.cta]])}
    <h1 class="reg-title">${esc(c.cta)}: ${esc(e.title)}</h1><p class="muted">${fmtDate(e.date, { weekday: 'long', month: 'long', day: 'numeric' })} · ${esc(e.time)} · ${esc(e.venue)}, ${esc(e.city)}</p></div>
  <div class="wrap section--tight"><div class="split"><div data-reg-host>${regStep(e)}</div><aside class="split__aside" aria-label="Order summary" data-reg-summary>${regSummary(e)}</aside></div></div></div>`;
}
function regSummary(e) {
  const T = regTotals(e);
  return `${pat('cry/order-summary')}<div class="give-card stack"><h2>Your order</h2>
    ${T.L.length ? `<dl class="summary">${T.L.map((l) => `<div><dt>${l.n} × ${esc(l.t.name)}</dt><dd>${l.total ? money(l.total) : 'Free'}</dd></div>`).join('')}${T.donation ? `<div><dt>Donation to ${esc(e.title)}</dt><dd>${fmtMoney(T.donation)}</dd></div>` : ''}<div class="summary__total"><dt>Total</dt><dd>${fmtMoney(T.total)}</dd></div></dl>` : '<p class="muted">Choose tickets to see your total.</p>'}
    ${T.ndp ? `<p class="taxnote">${icon('info', 'icon--sm')}<span>Of your seats, <b>${money(T.ndp)}</b> covers dinner and entertainment and is not tax-deductible. The remaining <b>${fmtMoney(T.total - T.ndp)}</b> is a tax-deductible gift to CRY America, a 501(c)(3).</span></p>` : T.donation ? `<p class="taxnote">${icon('shield', 'icon--sm')}<span>Your ${fmtMoney(T.donation)} donation is tax-deductible to the extent allowed by law. Ticket prices are not.</span></p>` : ''}
    <p class="muted"><small>${T.seats} ${T.seats === 1 ? 'attendee' : 'attendees'}</small></p></div>`;
}
function qtyStepper(e, t) {
  const n = STATE.reg.qty[t.id] || 0;
  const left = remaining(e, t);
  const max = Math.min(10, left);
  return `<div class="qty" role="group" aria-label="Quantity for ${esc(t.name)}">${btn('Remove one', { variant: 'icon', icon: 'minus', iconOnly: true, disabled: n === 0, attrs: `data-action="qty" data-id="${t.id}" data-d="-1"` })}<output aria-live="polite" aria-label="${esc(t.name)} quantity">${n}</output>${btn('Add one', { variant: 'icon', icon: 'plus', iconOnly: true, disabled: n >= max, attrs: `data-action="qty" data-id="${t.id}" data-d="1"` })}</div>`;
}
function regStep(e) {
  const r = STATE.reg;
  const T = regTotals(e);
  const C = DATA.eventContent[e.cat];
  const head = stepper(REG_STEPS.map((s, i) => (i === 4 && T.total === 0 ? 'Confirm' : s)), r.step);
  const foot = (next) => `<div class="wizard-foot">${r.step ? btn('Back', { variant: 'secondary', icon: 'arrow-left', attrs: 'data-action="reg-back"' }) : '<span></span>'}${btn(next || 'Continue', { type: 'submit', iconAfter: 'arrow-right' })}</div>`;
  if (r.step === 0) return `${head}<form class="give-card" data-reg novalidate><h2>Choose tickets</h2>
    <ul class="ticket-list">${ticketsOf(e).map((t) => { const left = remaining(e, t); return `<li class="${left ? '' : 'is-soldout'}"><div><b>${esc(t.name)}</b>${t.kind === 'bundle' ? ` <span class="tag">${t.seats} people</span>` : ''}${t.desc ? `<small>${esc(t.desc)}</small>` : ''}${t.ndp ? `<small>${money(t.ndp)} of each is not tax-deductible</small>` : ''}<small>${left ? (left < 15 ? `Only ${left} left` : `${left} available`) : 'Sold out'}</small></div><b class="ticket-list__price">${t.price ? money(t.price) : 'Free'}</b>${left ? qtyStepper(e, t) : '<span class="status status--archived">Sold out</span>'}</li>`; }).join('')}</ul>
    <p class="field__error" id="reg-err" hidden></p>${foot()}</form>`;
  if (r.step === 1) {
    const seats = Math.min(T.seats, 12);
    const signed = STATE.role !== 'visitor';
    return `${head}<form class="give-card" data-reg novalidate><h2>Attendees</h2><p class="muted">${T.seats > 1 ? 'Only the first attendee’s details are required now. You can add the others later from My Account.' : 'Tell us who is coming.'}</p>
      ${Array.from({ length: seats }, (_, i) => { const a = r.attendees[i] || (i === 0 && signed ? { first: DATA.me.first, last: DATA.me.last, email: DATA.me.email } : {}); return `<fieldset class="attendee"><legend>Attendee ${i + 1}</legend><div class="field-row">${field({ id: `at-${i}-first`, label: 'First name', required: i === 0, value: a.first || '', autocomplete: i === 0 ? 'given-name' : 'off' })}${field({ id: `at-${i}-last`, label: 'Last name', required: i === 0, value: a.last || '', autocomplete: i === 0 ? 'family-name' : 'off' })}${field({ id: `at-${i}-email`, label: i === 0 ? 'Email (tickets go here)' : 'Email (optional)', type: 'email', required: i === 0, value: a.email || '', autocomplete: i === 0 ? 'email' : 'off' })}</div>
        <div class="field-row">${questionsOf(e).map((qn) => qn.type === 'select' ? field({ id: `at-${i}-${qn.id}`, label: qn.label, type: 'select', options: qn.options, value: (a.answers || {})[qn.id] }) : field({ id: `at-${i}-${qn.id}`, label: qn.label, value: (a.answers || {})[qn.id] || '' })).join('')}</div></fieldset>`; }).join('')}
      ${T.seats > 12 ? `<p class="muted">${T.seats - 12} more guests: add their names later from My Account.</p>` : ''}${foot()}</form>`;
  }
  if (r.step === 2) return `${head}<form class="give-card" data-reg novalidate><h2>${e.cat === 'gala' ? 'Event policies' : 'Waiver'}</h2>
    <div class="waiver" tabindex="0" role="document" aria-label="Waiver text"><p>${esc(e.waiver || C.waiver)}</p><p class="muted">Full waiver text from the legal team appears here.</p></div>
    ${check(`I have read and agree to the ${e.cat === 'gala' ? 'event policies' : 'waiver'} for everyone in my order`, { checked: r.waiver, attrs: 'data-r="waiver" id="reg-waiver"' })}
    <p class="field__error" id="reg-waiver-e" hidden></p>
    ${field({ id: 'reg-signer', label: 'Type your full name to sign', required: true, value: r.signer, autocomplete: 'name' })}${foot()}</form>`;
  if (r.step === 3) {
    const mine = myPageFor(e);

/* Mock QR code: deterministic modules with three finder patterns (not scannable). */
function qrSvg(text) {
  const n = 25; let seed = hashCode(text); const cells = [];

  return `<svg class="qr" viewBox="-1 -1 ${n + 2} ${n + 2}" role="img" aria-label="Ticket QR code (mock)"><rect x="-1" y="-1" width="${n + 2}" height="${n + 2}" class="qr-bg"/>${finder(0, 0)}${finder(n - 7, 0)}${finder(0, n - 7)}${cells.join('')}</svg>`;
}

function pledgeSchedule(amount, plan, count, start) {
  if (plan === 'now') return [{ date: TODAY, amount }];
  const n = plan === 'once' ? 1 : count;

  const base = Math.floor((amount / n) * 100) / 100;

}

/* =====================================================================
   Stage 5 · My Occasions and event fundraising
   - My Occasions (/my-occasions/...): individual pages, never on a team.
   - Event fundraising (/events/{event}/fundraise|teams/...): only for events
     with fundraising open; one team per person per event.
   Rollup: Individual → Team → City event → National (Walk). raised is always
   computed from donations, so every total and donor table agrees.
   ===================================================================== */
const OCCASIONS = [
  ['Birthday', 'gift', 'Ask for gifts that change a child’s life.'],
  ['Anniversary', 'heart', 'Celebrate your years together by giving forward.'],
  ['Memorial', 'sun', 'Honor someone you love with a lasting gift.'],
  ['Arangetram', 'sparkle', 'Dedicate your debut performance to children.'],
  ['Festival', 'star', 'Diwali, Eid, Christmas or any festival of giving.'],
  ['Community', 'users', 'A bake sale, a school drive or a challenge.'],
];
const meName = () => `${DATA.me.first} ${DATA.me.last}`;
const isMine = (f) => STATE.role !== 'visitor' && f.owner === meName();
const myTeamFor = (eventSlug) => { const p = DATA.fundraisers.find((f) => f.event === eventSlug && f.owner === meName()); return p && p.team ? teamOf(p.team) : null; };
const slugify = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 48);
const ytId = (u) => { const m = /(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/.exec(u || ''); return m ? m[1] : null; };
function fundMedia(f) {
  const pics = (f.photos || []).length ? f.photos.map((src, i) => `<figure class="media" style="--ar:4/3;--r:var(--wp--custom--radius--lg)"><img src="${src}" alt="Photo ${i + 1} from ${esc(f.owner)}"></figure>`) : f.img ? [img(f.img, { ar: '4/3', cls: 'media--round' })] : [];
  const video = f.video && ytId(f.video) ? `<div class="video" data-video="${ytId(f.video)}"><div class="placeholder" style="--ar:16/9;--r:0"><span>Video from ${esc(f.owner)}</span></div><button class="video__play" type="button" data-action="play-video" aria-label="Play video: ${esc(f.title)}"><span><i>${icon('play')}</i>Play video</span></button></div>` : '';
  if (!pics.length && !video) return f.type === 'occasion' ? categoryArtIcon((OCCASIONS.find((o) => o[0] === f.occasion) || OCCASIONS[5])[1], '16/9') : categoryArt(eventOf(f.event).cat, '16/9');
  return `<div class="fr-media ${pics.length > 1 ? 'fr-media--two' : ''}">${pics.join('')}</div>${video}`;
}

/* F-03 Create / edit wizard (occasion or event page) */
const WIZ_STEPS = ['Basics', 'Story', 'Photos & video', 'Settings', 'Preview'];
function wizardFor(f) {
  if (!STATE.wiz || STATE.wiz.slug !== f.slug) STATE.wiz = { slug: f.slug, step: 0 };
  return STATE.wiz;
}
function pageFundEdit(params) {
  let f;
  if (params.occasion) f = fundOf(params.occasion);
  else if (params.page) f = fundOf(params.page);
  else {
    /* /events/{event}/fundraise/start: reuse my page for this event, or create a draft (one page per person per event). */
    const e = eventOf(params.event);
    f = DATA.fundraisers.find((x) => x.event === e.slug && x.owner === meName());
    if (!f) { f = { slug: slugify(`${DATA.me.first}-${e.slug}`), type: 'personal', owner: meName(), title: '', event: e.slug, team: null, goal: 500, img: null, status: 'draft', donations: [], photos: [], showDonors: true, showAmounts: true }; DATA.fundraisers.push(f); }
  }
  if (!isMine(f) && STATE.role !== 'super-admin') return `<div class="wrap"><div class="notice-page" data-owner-denied><span class="notice-page__ico">${icon('lock')}</span><h1>You can only edit your own page</h1><p class="lead">This page belongs to ${esc(f.owner)}.</p>${btn('View the page', { href: hrefFund(f) })}</div></div>`;
  const w = wizardFor(f);
  const e = f.event && eventOf(f.event);
  return `<div class="wrap section--tight">${breadcrumbs(f.type === 'occasion' ? [['Home', '#/'], ['My Occasions', '#/my-occasions'], [f.status === 'draft' ? 'New page' : 'Edit page']] : [['Home', '#/'], ['Events', '#/events'], [e.title, hrefEvent(e)], [f.status === 'draft' ? 'Fundraise' : 'Edit page']])}
    <h1 class="reg-title">${f.status === 'draft' ? (f.type === 'occasion' ? 'Create your occasion page' : `Fundraise for ${esc(e.title)}`) : 'Edit your fundraising page'}</h1>${f.status === 'live' ? `<p>${statusBadge('live')} <a href="${hrefFund(f)}">View page</a></p>` : `<p>${statusBadge('draft')} <span class="muted">Saved as you go.</span></p>`}</div>
  <div class="wrap section--tight" data-wiz-host="${f.slug}">${wizStep(f)}</div>`;
}
function suggestTitle(f) {
  const first = f.owner.split(' ')[0];
  if (f.type === 'occasion') return { Birthday: `${first}’s birthday for children`, Anniversary: `${first}’s anniversary: celebrate with us`, Memorial: `In loving memory`, Arangetram: `${first}’s arangetram for girls’ education`, Festival: `${first}’s festival of giving`, Community: `${first}’s community fundraiser` }[f.occasion] || `${first} for CRY`;
  return { walk: `${first} walks for children`, holi: `${first} celebrates Holi for children`, dandiya: `${first} dances for children` }[eventOf(f.event).cat] || `${first} for children`;
}
function storyTemplate(f) {
  if (f.type === 'occasion') return `This ${f.occasion ? f.occasion.toLowerCase() : 'occasion'}, instead of gifts, I’m asking friends and family to support CRY America. CRY’s partners help children in India and the US go to school, stay healthy and stay safe. Any amount helps, and every gift is tax-deductible.`;
  return `I’m taking part in ${eventOf(f.event).title} to support children’s rights. CRY’s partners keep children in school, healthy and safe. Please help me reach my goal: every gift is tax-deductible and goes to CRY America’s projects.`;
}
function wizStep(f) {
  const w = STATE.wiz;
  const e = f.event && eventOf(f.event);
  const head = stepper(WIZ_STEPS, w.step);
  const foot = (next) => `<div class="wizard-foot">${w.step ? btn('Back', { variant: 'secondary', icon: 'arrow-left', attrs: 'data-action="wiz-back"' }) : '<span></span>'}${btn(next || 'Save and continue', { type: 'submit', iconAfter: next ? '' : 'arrow-right', icon: next ? 'check' : '' })}</div>`;
  const myTeam = e && myTeamFor(e.slug);
  const teams = e ? DATA.teams.filter((t) => t.event === e.slug) : [];
  if (w.step === 0) return `${head}${pat('cry/fundraiser-wizard')}<form class="give-card wiz" data-wiz novalidate><h2>Basics</h2>
    ${field({ id: 'wz-title', label: 'Page title', required: true, value: f.title || '', hint: `Suggestion: “${suggestTitle(f)}”` })}
    <p>${btn('Use the suggestion', { variant: 'tertiary', attrs: `data-action="wiz-suggest" data-text="${esc(suggestTitle(f))}"` })}</p>
    <div class="field-row">${field({ id: 'wz-goal', label: 'Goal', prefix: '$', required: true, value: f.goal || '', hint: 'Most pages raise $500–$2,500.', attrs: 'inputmode="decimal" data-min="50"' })}${field({ id: 'wz-end', label: 'End date', type: 'date', value: f.endDate || (e ? e.date : '2026-12-31') })}</div>
    ${f.type === 'occasion' ? field({ id: 'wz-occ', label: 'Occasion', type: 'select', options: OCCASIONS.map((o) => o[0]), value: f.occasion }) : `<div class="give-card card--flat"><b>Event</b><p class="muted">${esc(e.title)} · ${fmtDate(e.date)}</p>
      ${myTeam && f.team === myTeam.slug ? `<p>${icon('users', 'icon--sm')} You are on <b>Team ${esc(myTeam.name)}</b>. <a href="${hrefTeam(myTeam)}">Team page</a></p>` : `<fieldset><legend>Team (optional)</legend>${check('No team', { type: 'radio', name: 'wz-team', checked: !f.team, attrs: 'value=""' })}${teams.map((t) => check(`Join Team ${t.name}`, { type: 'radio', name: 'wz-team', checked: f.team === t.slug, attrs: `value="${t.slug}"`, sub: `Captain ${t.captain} · ${money(ROLLUP.team(t))} raised` })).join('')}<p class="field__hint">You can be on one team per event. ${btn('Create a team instead', { variant: 'tertiary', href: `#/events/${e.slug}/teams/new` })}</p></fieldset>`}</div>`}
    ${foot()}</form>`;
  if (w.step === 1) return `${head}<form class="give-card wiz" data-wiz novalidate><h2>Your story</h2><p class="muted">Tell people why this matters to you. Short and personal works best.</p>
    ${field({ id: 'wz-story', label: 'Story', type: 'textarea', required: true, value: f.story || '' })}
    <p>${btn('Start from a template', { variant: 'tertiary', attrs: `data-action="wiz-template" data-text="${esc(storyTemplate(f))}"` })}</p>${foot()}</form>`;
  if (w.step === 2) return `${head}<form class="give-card wiz" data-wiz novalidate><h2>Photos and video</h2>
    <div data-upload data-max="2" class="upload"><span class="field__label" id="wz-up-l">Photos (up to 2)</span><label class="upload__drop">${icon('upload')}<b>Choose up to 2 photos</b><span>Shown at 4:3. Photos are checked by our team before they go public.</span><input type="file" accept="image/*" multiple aria-labelledby="wz-up-l" aria-describedby="wz-up-e"></label><p class="field__error" id="wz-up-e" hidden></p>
      <div class="upload__previews" aria-live="polite">${(f.photos || []).map((src, i) => `<div class="upload__thumb"><figure class="media"><img src="${src}" alt="Photo ${i + 1}"></figure><button type="button" aria-label="Remove photo ${i + 1}" data-action="wiz-photo-remove" data-i="${i}">${icon('x', 'icon--sm')}</button></div>`).join('')}</div></div>
    ${field({ id: 'wz-video', label: 'YouTube video link (optional)', type: 'url', value: f.video || '', placeholder: 'https://www.youtube.com/watch?v=…', hint: 'Shown at 16:9 using YouTube’s privacy-enhanced mode.' })}${foot()}</form>`;
  if (w.step === 3) return `${head}<form class="give-card wiz" data-wiz novalidate><h2>Settings</h2>
    <fieldset><legend>Privacy</legend>${check('Show donor names on my page', { checked: f.showDonors !== false, attrs: 'id="wz-donors"' })}${check('Show gift amounts', { checked: f.showAmounts !== false, attrs: 'id="wz-amounts"' })}</fieldset>
    ${field({ id: 'wz-ac', label: 'Action Center (optional)', type: 'select', options: ['None'].concat(activeACs().map((a) => a.name)), value: f.ac ? acOf(f.ac).name : (e && e.ac ? acOf(e.ac).name : 'None'), hint: 'Your page counts toward this Action Center’s local total.' })}
    ${foot()}</form>`;
  return `${head}<form class="give-card wiz" data-wiz novalidate><h2>Preview</h2><p class="muted">This is how your page will look. Publish when you’re ready; you can edit any time.</p>
    <div class="preview-frame">${fundraiserBody(f, true)}</div>
    <div class="wizard-foot">${btn('Back', { variant: 'secondary', icon: 'arrow-left', attrs: 'data-action="wiz-back"' })}${btn(f.status === 'live' ? 'Save changes' : 'Publish my page', { type: 'submit', size: 'lg', icon: 'check' })}</div></form>`;
}
function wizRead(form, f) {
  const w = STATE.wiz;
  const v = (id) => (form.querySelector('#' + id) || {}).value;
  if (w.step === 0) { f.title = v('wz-title'); f.goal = parseFloat(v('wz-goal')) || f.goal; f.endDate = v('wz-end'); if (f.type === 'occasion') f.occasion = v('wz-occ'); const t = form.querySelector('[name="wz-team"]:checked'); if (t) f.team = t.value || null; }
  if (w.step === 1) f.story = v('wz-story');
  if (w.step === 2) { f.video = v('wz-video'); f.photos = [...form.querySelectorAll('.upload__thumb img')].map((i) => i.src).slice(0, 2); }
  if (w.step === 3) { f.showDonors = form.querySelector('#wz-donors').checked; f.showAmounts = form.querySelector('#wz-amounts').checked; const ac = activeACs().find((a) => a.name === v('wz-ac')); f.ac = ac ? ac.slug : null; }
}
function wizSubmit(form) {
  const f = fundOf(STATE.wiz.slug);
  const w = STATE.wiz;
  wizRead(form, f);
  const ok = [...form.querySelectorAll('.input[required], .textarea[required], .input[data-min]')].map(validateField).every(Boolean);
  if (!ok) { toast('Please fix the highlighted fields.', 'error'); form.querySelector('[aria-invalid="true"]').focus(); return; }
  if (w.step === 2 && f.video && !ytId(f.video)) { const el = form.querySelector('#wz-video'); el.setAttribute('aria-invalid', 'true'); const er = form.querySelector('#wz-video-e'); er.hidden = false; er.innerHTML = icon('x-circle', 'icon--sm') + 'Paste a YouTube link, like https://www.youtube.com/watch?v=…'; el.focus(); return; }
  if (w.step < 4) { w.step++; return wizRefresh(f); }
  const first = f.status !== 'live';
  f.status = 'live';
  f.moderation = 'new';
  STATE.wiz = null;
  location.hash = hrefFund(f);
  toast(first ? 'Your page is live. Share the link to get your first gift!' : 'Changes saved.', 'success');
}
function wizRefresh(f) {
  const host = document.querySelector('[data-wiz-host]');
  host.innerHTML = wizStep(f);
  const h = host.querySelector('h2'); h.setAttribute('tabindex', '-1'); h.focus(); host.scrollIntoView({ block: 'start' });
}

    </div>
    <aside class="split__aside" aria-label="Progress and donors">
      <div class="give-card stack">${meter({ raised: ROLLUP.fundraiser(f), goal: f.goal, donors: f.donations.length, label: (f.title || 'Fundraiser') + ' progress' })}
        ${preview ? btn('Donate', { block: true, size: 'lg', disabled: true }) : btn(`Donate to ${f.owner.split(/ & | /)[0]}`, { block: true, size: 'lg', href: `${hrefFund(f)}/donate`, icon: 'heart' })}
        ${btn('Share', { block: true, variant: 'secondary', icon: 'share', attrs: 'data-action="share"' })}
        ${t ? `<p class="muted"><small>Gifts here also count toward Team ${esc(t.name)} (${money(ROLLUP.team(t))}) and ${esc(e.title)}.</small></p>` : e ? `<p class="muted"><small>Gifts here also count toward ${esc(e.title)}.</small></p>` : ''}</div>
      ${f.showDonors !== false && donors.length ? donorTable(f.showAmounts === false ? donors.map((d) => ({ ...d, msg: '' })) : donors, { caption: 'Donors', dates: false }) : ''}
    </aside></div>`;
}
function pageFundraiser(params) {
  const f = fundOf(params.page || params.occasion);
  if (f.status === 'draft' && !isMine(f)) return page404();
  const e = f.event && eventOf(f.event);
  return `<div class="wrap section--tight">${breadcrumbs(f.type === 'occasion' ? [['Home', '#/'], ['My Occasions', '#/my-occasions'], [f.title]] : [['Home', '#/'], ['Events', '#/events'], [e.title, hrefEvent(e)], [f.owner]])}
    ${f.status === 'draft' ? alertBox('warning', `This page is a draft. <a href="${hrefFund(f)}/edit">Finish and publish it</a>.`, 'Draft') : ''}</div>
  <div class="wrap section--tight">${fundraiserBody(f)}</div>`;
}

/* F-10 Donate to a fundraiser or team (gift is attributed, so every rollup updates) */
function pageFundDonate(params) {
  const f = params.page || params.occasion ? fundOf(params.page || params.occasion) : null;
  const t = params.team ? teamOf(params.team) : null;
  const target = f ? f.title : `Team ${t.name}`;
  const back = f ? hrefFund(f) : hrefTeam(t);
  return `<div class="wrap wrap--content section--tight">${breadcrumbs([['Home', '#/'], [target, back], ['Donate']])}<h1 class="reg-title">Donate to ${esc(target)}</h1>
    ${pat('cry/fundraiser-donate')}<form class="give-card" data-fund-donate="${f ? 'page:' + f.slug : 'team:' + t.slug}" novalidate>
      <fieldset><legend>Amount</legend><div class="rcards" style="--min:100px">${[25, 50, 100, 250].map((v, i) => { const id = uid('fd'); return `<div class="rcard"><input type="radio" name="fd-amt" id="${id}" value="${v}" ${i === 1 ? 'checked' : ''}><label for="${id}"><b>$${v}</b></label><span class="rcard__tick">${icon('check')}</span></div>`; }).join('')}</div></fieldset>
      ${field({ id: 'fd-other', label: 'Other amount', prefix: '$', attrs: 'inputmode="decimal" data-min="5"' })}
      ${nameFields('fd', { required: true, first: STATE.role !== 'visitor' ? DATA.me.first : '', last: STATE.role !== 'visitor' ? DATA.me.last : '' })}${field({ id: 'fd-email', label: 'Email (for your receipt)', type: 'email', required: true, autocomplete: 'email', value: STATE.role !== 'visitor' ? DATA.me.email : '' })}
      ${field({ id: 'fd-msg', label: 'Message of support (optional)', type: 'textarea', placeholder: 'Shown on the page' })}
      ${check('Show my name as Anonymous', { attrs: 'id="fd-anon"' })}
      <div class="stripe-mock">${paymentFields('card', 'fd')}</div>
      ${btn('Give', { type: 'submit', size: 'lg', block: true, icon: 'heart' })}
      <p class="taxnote">${icon('shield', 'icon--sm')}<span>${esc(DATA.org.status)}</span></p>
    </form></div>`;
}

/* F-05 Create a team (event) */
function pageTeamNew(params) {
  const e = eventOf(params.event);
  const mine = myTeamFor(e.slug);
  if (mine) return `<div class="wrap wrap--content section">${alertBox('info', `You are already on <a href="${hrefTeam(mine)}">Team ${esc(mine.name)}</a> for ${esc(e.title)}. You can be on one team per event.`, 'One team per event')}<p>${btn('Go to my team', { href: hrefTeam(mine) })}</p></div>`;
  return `<div class="wrap wrap--content section--tight">${breadcrumbs([['Home', '#/'], ['Events', '#/events'], [e.title, hrefEvent(e)], ['Create a team']])}
    <h1 class="reg-title">Create a team for ${esc(e.title)}</h1><p class="muted">You become the captain. Invite friends, classmates or coworkers once the team is set up.</p>
    ${pat('cry/team-create')}<form class="give-card" data-team-new="${e.slug}" novalidate>
      ${field({ id: 'tn-name', label: 'Team name', required: true, placeholder: 'e.g. Sugar Land Striders' })}
      <fieldset><legend>Team type</legend>${seg('tn-type', [{ value: 'Community', label: 'Friends & family' }, { value: 'School', label: 'School' }, { value: 'Company', label: 'Company' }], { value: 'Community', block: true, label: 'Team type' })}</fieldset>
      <div class="field-row">${field({ id: 'tn-goal', label: 'Team goal', prefix: '$', required: true, value: '2000', attrs: 'inputmode="decimal" data-min="100"' })}</div>
      ${field({ id: 'tn-story', label: 'Why is your team walking?', type: 'textarea' })}
      ${upload({ label: 'Team photo (optional)', max: 1 })}
      ${btn('Create team', { type: 'submit', size: 'lg', icon: 'users' })}
    </form></div>`;
}

/* F-06 Join a team (enforces one team per person per event) */
function pageTeamJoin(params) {
  const t = teamOf(params.team);
  const e = eventOf(t.event);
  const cur = myTeamFor(e.slug);
  const members = DATA.fundraisers.filter((f) => f.team === t.slug);
  if (cur && cur.slug === t.slug) return `<div class="wrap wrap--content section">${alertBox('success', `You are already on Team ${esc(t.name)}.`, 'Already a member')}<p>${btn('Team page', { href: hrefTeam(t) })}</p></div>`;
  return `<div class="wrap wrap--content section--tight">${breadcrumbs([['Home', '#/'], ['Events', '#/events'], [e.title, hrefEvent(e)], ['Team ' + t.name, hrefTeam(t)], ['Join']])}
    <h1 class="reg-title">Join Team ${esc(t.name)}</h1><p class="muted">${esc(e.title)} · captain ${esc(t.captain)} · ${members.length} members</p>
    ${pat('cry/team-join')}<form class="give-card stack" data-team-join="${t.slug}" novalidate>
      ${cur ? alertBox('warning', `You are on <b>Team ${esc(cur.name)}</b> for this event. You can be on one team per event, so joining moves your page and its gifts to Team ${esc(t.name)}.`, 'You’re already on a team') : ''}
      <p>${DATA.fundraisers.some((f) => f.event === e.slug && f.owner === meName()) ? 'Your fundraising page will move to this team, with everything it has raised.' : 'We will create your fundraising page under this team. You can edit it next.'}</p>
      ${btn(cur ? `Leave ${cur.name} and join` : 'Join the team', { type: 'submit', size: 'lg', icon: 'users' })}
    </form></div>`;
}

/* F-07 Team page */
function pageTeamPage(params) {
  const t = teamOf(params.team);
  const e = eventOf(t.event);
  const members = DATA.fundraisers.filter((f) => f.team === t.slug).sort((a, b) => ROLLUP.fundraiser(b) - ROLLUP.fundraiser(a));
  const dons = ROLLUP.teamDonations(t);
  const mine = myTeamFor(e.slug);
  return `<div class="wrap section--tight">${breadcrumbs([['Home', '#/'], ['Events', '#/events'], [e.title, hrefEvent(e)], ['Team ' + t.name]])}</div>
  <div class="wrap section--tight"><div class="split">
    <div class="stack" style="--stack:var(--wp--preset--spacing--40)">
      <header class="team-head"><span class="team-mark team-mark--lg" aria-hidden="true">${esc(initials(t.name))}</span><div><div class="cluster">${badgeCat(e.cat)}<span class="tag">${esc(t.type)} team</span></div><h1 class="fr-title">Team ${esc(t.name)}</h1><p class="muted">Captain <b>${esc(t.captain)}</b> · fundraising for <a href="${hrefEvent(e)}">${esc(e.title)}</a></p></div></header>
      <p class="lead">${esc(t.story || `We are walking together at ${e.title} so more children can learn, grow and stay safe. Join us or support a member below.`)}</p>
      <section aria-labelledby="tm-mem"><h2 id="tm-mem">Members (${members.length})</h2>${leaderboard(members.map((f) => ({ name: f.owner, sub: (f.owner === t.captain ? 'Captain · ' : '') + `${pct(ROLLUP.fundraiser(f), f.goal)}% of ${money(f.goal || 0)}`, amount: ROLLUP.fundraiser(f), href: hrefFund(f) })), { label: 'Team members by amount raised' })}</section>
      ${t.donations.length ? `<p class="muted"><small>Plus ${money(ROLLUP.sum(t.donations))} given to the team page directly.</small></p>` : ''}
    </div>
    <aside class="split__aside" aria-label="Team progress">
      <div class="give-card stack">${meter({ raised: ROLLUP.team(t), goal: t.goal, donors: dons.length, label: 'Team progress' })}
        ${mine && mine.slug === t.slug ? btn('You’re on this team', { block: true, variant: 'secondary', disabled: true }) : btn('Join the team', { block: true, size: 'lg', href: `${hrefTeam(t)}/join`, icon: 'users' })}
        ${btn('Donate to the team', { block: true, variant: 'secondary', href: `${hrefTeam(t)}/donate`, icon: 'heart' })}
        ${t.captain === meName() && STATE.role !== 'visitor' ? btn('Manage team', { block: true, variant: 'tertiary', href: `#/account/teams/${t.slug}` }) : ''}
      </div>
      ${dons.length ? donorTable(dons, { caption: 'Team donors', dates: false }) : ''}
    </aside></div></div>`;
}

/* F-08 Manage team (captain) */
function pageManageTeam(params) {
  const t = teamOf(params.team);
  const e = eventOf(t.event);
  if (t.captain !== meName() && STATE.role !== 'super-admin') return `<div class="wrap"><div class="notice-page" data-owner-denied><span class="notice-page__ico">${icon('lock')}</span><h1>Only the team captain can manage this team</h1><p class="lead">Team ${esc(t.name)} is captained by ${esc(t.captain)}.</p>${btn('Team page', { href: hrefTeam(t) })}</div></div>`;
  const members = DATA.fundraisers.filter((f) => f.team === t.slug);
  const csv = 'Name,Page,Raised,Goal\n' + members.map((f) => `"${f.owner}","${f.title}",${ROLLUP.fundraiser(f)},${f.goal || ''}`).join('\n');
  return `<div class="wrap section--tight">${breadcrumbs([['Home', '#/'], ['My Account', '#/account'], ['Team ' + t.name]])}<h1 class="reg-title">Manage Team ${esc(t.name)}</h1><p class="muted">${esc(e.title)} · ${money(ROLLUP.team(t))} of ${money(t.goal)}</p></div>
  <div class="wrap section--tight"><div class="ds-grid-2">
    ${pat('cry/team-manage')}<form class="give-card" data-team-edit="${t.slug}" novalidate><h2>Team details</h2>${field({ id: 'te-name', label: 'Team name', required: true, value: t.name })}${field({ id: 'te-goal', label: 'Team goal', prefix: '$', required: true, value: String(t.goal), attrs: 'inputmode="decimal" data-min="100"' })}${field({ id: 'te-story', label: 'Team story', type: 'textarea', value: t.story || '' })}${btn('Save details', { type: 'submit' })}</form>
    <div class="stack">
      <div class="give-card stack"><h2>Invite members</h2><div class="field"><label class="field__label" for="te-link">Share this link</label><div class="input-affix"><input class="input" id="te-link" readonly value="https://cryamerica.org${hrefTeam(t).slice(1)}/join"></div></div>${btn('Copy link', { variant: 'secondary', icon: 'share', attrs: 'data-action="share"' })}
        <form data-team-invite novalidate class="cluster" style="align-items:end">${field({ id: 'te-invite', label: 'Invite by email', type: 'email', required: true, placeholder: 'friend@example.com' })}${btn('Send invite', { type: 'submit', variant: 'secondary' })}</form></div>
      <form class="give-card stack" data-team-msg novalidate><h2>Message your team</h2>${field({ id: 'te-msg', label: 'Message', type: 'textarea', required: true })}${btn('Send to ' + members.length + ' members', { type: 'submit', variant: 'secondary', icon: 'mail' })}</form>
    </div></div>
    <section class="section--tight" aria-labelledby="te-mem"><div class="section-head"><div><h2 id="te-mem">Members</h2></div><a class="btn btn--secondary" href="data:text/csv;charset=utf-8,${encodeURIComponent(csv)}" download="team-${t.slug}.csv">${icon('download')}Export member list (CSV)</a></div>
      <div class="table-wrap"><table class="table"><thead><tr><th scope="col">Member</th><th scope="col" class="num">Raised</th><th scope="col" class="num">Goal</th><th scope="col"><span class="sr-only">Actions</span></th></tr></thead><tbody>${members.map((f) => `<tr><td><a href="${hrefFund(f)}">${esc(f.owner)}</a>${f.owner === t.captain ? ' <span class="tag">Captain</span>' : ''}</td><td class="num">${money(ROLLUP.fundraiser(f))}</td><td class="num">${f.goal ? money(f.goal) : '—'}</td><td>${f.owner === t.captain ? '' : btn('Remove', { variant: 'danger', size: 'sm', attrs: `data-action="team-remove" data-page="${f.slug}" aria-label="Remove ${esc(f.owner)} from the team"` })}</td></tr>`).join('')}</tbody>
      <tfoot><tr><th scope="row">Team total (members + team page gifts)</th><td class="num">${money(ROLLUP.team(t))}</td><td class="num">${money(t.goal)}</td><td></td></tr></tfoot></table></div></section>
  </div>
  <dialog class="modal" id="remove-modal" aria-labelledby="rm-title"><div class="modal__head"><h2 id="rm-title">Remove member?</h2>${btn('Close', { variant: 'icon', icon: 'x', iconOnly: true, attrs: 'data-action="close-dialog"' })}</div><div class="modal__body"><p data-rm-text></p></div><div class="modal__foot">${btn('Cancel', { variant: 'secondary', attrs: 'data-action="close-dialog"' })}${btn('Remove from team', { variant: 'danger', attrs: 'data-action="team-remove-confirm"' })}</div></dialog>`;
}

/* F-11 Leaderboards (Individual → Team → City event → National) */
function pageLeaderboards() {
  const q = STATE.query;
  const year = Number(q.year || TODAY.slice(0, 4));
  const evs = DATA.events.filter((e) => e.fundraising && e.date.startsWith(String(year)) && (!q.event || e.slug === q.event) && (!q.ac || e.ac === q.ac));
  const pages = DATA.fundraisers.filter((f) => f.type === 'personal' && evs.some((e) => e.slug === f.event) && f.status === 'live');
  const teams = DATA.teams.filter((t) => evs.some((e) => e.slug === t.event));
  const all = DATA.events.filter((e) => e.fundraising);
  const nat = ROLLUP.national('walk', year);
  return `${pageHeader({ title: 'Event fundraising leaderboards', lead: 'Top fundraisers and teams at CRY Walks and festivals. Every gift rolls up from individual pages to teams, city events and the national Walk total.', crumbs: [['Home', '#/'], ['Events', '#/events'], ['Leaderboards']] })}
  <div class="wrap section--tight">
    <div class="filters" role="search" aria-label="Filter leaderboards">
      <div class="field"><label class="field__label" for="lb-event">Event</label><select class="select" id="lb-event" data-qfilter="event"><option value="">All events</option>${all.map((e) => `<option value="${e.slug}" ${q.event === e.slug ? 'selected' : ''}>${esc(e.title)}</option>`).join('')}</select></div>
      <div class="field"><label class="field__label" for="lb-ac">Action Center</label><select class="select" id="lb-ac" data-qfilter="ac"><option value="">All cities</option>${activeACs().map((a) => `<option value="${a.slug}" ${q.ac === a.slug ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select></div>
      <div class="field"><label class="field__label" for="lb-year">Year</label><select class="select" id="lb-year" data-qfilter="year"><option value="2026">2026</option></select></div>
    </div>
    <div class="ds-grid-2" style="margin-top:var(--wp--preset--spacing--30)">
      <section class="give-card" aria-labelledby="lb-ind"><h2 id="lb-ind">Top fundraisers</h2>${pages.length ? leaderboard(pages.map((f) => ({ name: f.owner, sub: `${eventOf(f.event).title}${f.team ? ' · Team ' + teamOf(f.team).name : ''}`, amount: ROLLUP.fundraiser(f), href: hrefFund(f) })).sort((a, b) => b.amount - a.amount).slice(0, 10)) : '<p class="muted">No fundraising pages yet.</p>'}</section>
      <section class="give-card" aria-labelledby="lb-team"><h2 id="lb-team">Top teams</h2>${teams.length ? leaderboard(teams.map((t) => ({ name: t.name, sub: `${eventOf(t.event).title} · ${DATA.fundraisers.filter((f) => f.team === t.slug).length} members`, amount: ROLLUP.team(t), href: hrefTeam(t) })).sort((a, b) => b.amount - a.amount), { label: 'Top teams' }) : '<p class="muted">No teams yet.</p>'}</section>
    </div>
  </div>
  <section class="section--tight" aria-labelledby="lb-roll"><div class="wrap"><h2 id="lb-roll">How it adds up</h2><p class="muted">Each city event total = gifts to individual pages + gifts to team pages + gifts to the event directly.</p>
    <div class="table-wrap"><table class="table" data-rollup-table><thead><tr><th scope="col">City event</th><th scope="col" class="num">Individual pages</th><th scope="col" class="num">Team pages</th><th scope="col" class="num">Direct to event</th><th scope="col" class="num">Event total</th></tr></thead>
      <tbody>${evs.map((e) => { const ind = DATA.fundraisers.filter((f) => f.event === e.slug).reduce((a, f) => a + ROLLUP.fundraiser(f), 0); const tm = DATA.teams.filter((t) => t.event === e.slug).reduce((a, t) => a + ROLLUP.sum(t.donations), 0); const dir = ROLLUP.sum(DATA.eventDonations[e.slug] || []); return `<tr><th scope="row"><a href="${hrefEvent(e)}">${esc(e.title)}</a></th><td class="num">${money(ind)}</td><td class="num">${money(tm)}</td><td class="num">${money(dir)}</td><td class="num" data-sum="${ind + tm + dir}" data-total="${ROLLUP.event(e)}"><b>${money(ROLLUP.event(e))}</b></td></tr>`; }).join('')}</tbody>
      ${!q.event && !q.ac ? `<tfoot><tr><th scope="row">National · Walks ${year}</th><td colspan="3"></td><td class="num">${money(nat.raised)}</td></tr></tfoot>` : ''}</table></div>
  </div></section>`;
}

/* =====================================================================
   Stage 3 · Give: donate (3 steps), campaign landing, ways to give,
   thank-you (adapts to the gift) and payment problem.
   Donations show 501(c)(3) tax-deductible language.
   ===================================================================== */
function donateDefaults() {
  const q = STATE.query;
  return { ac: null, step: 0, freq: q.freq || 'monthly', amount: +(q.amount || 99), other: '', designation: q.designation || 'general', tribute: false, tributeType: 'honor', tributeName: '', tributeEmail: '', fee: true, employer: '', first: '', last: '', email: '', address: '', city: '', state: '', zip: '', anon: false, method: 'card', decline: false };
}
const giftTotal = (d) => { const base = d.other ? parseFloat(d.other) || 0 : d.amount; return d.fee ? Math.round(base * 1.03 * 100) / 100 : base; };
const fmtMoney = (n) => '$' + n.toLocaleString('en-US', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });

/* G-06 Donate */
function pageDonate() {
  if (!STATE.donate || STATE.query.fresh) STATE.donate = donateDefaults();
  if (STATE.query.step) STATE.donate.step = Math.min(2, +STATE.query.step);
  return `${pageHeader({ title: 'Make a gift', lead: 'Your gift helps children claim their rights to survival, development, protection and participation.', crumbs: [['Home', '#/'], ['Donate']] })}
  <div class="wrap section--tight"><div class="split">
    <div data-donate-host>${donateStep()}</div>
    <aside class="split__aside" aria-label="Gift summary" data-donate-summary>${donateSummary()}</aside>
  </div></div>`;
}
function donateSummary() {
  const d = STATE.donate;
  const base = d.other ? parseFloat(d.other) || 0 : d.amount;
  return `${pat('cry/gift-summary')}<div class="give-card stack">
    <h2>Your gift</h2>
    <dl class="summary">
      <div><dt>Amount</dt><dd>${fmtMoney(base)}${d.freq === 'monthly' ? ' / month' : ''}</dd></div>
      ${d.fee ? `<div><dt>Processing fee covered</dt><dd>${fmtMoney(Math.round(base * 0.03 * 100) / 100)}</dd></div>` : ''}
      <div><dt>Designation</dt><dd>${esc(designationLabel(d.designation))}</dd></div>
      ${d.tribute && d.tributeName ? `<div><dt>${d.tributeType === 'memory' ? 'In memory of' : 'In honor of'}</dt><dd>${esc(d.tributeName)}</dd></div>` : ''}
      <div class="summary__total"><dt>Total</dt><dd>${fmtMoney(giftTotal(d))}${d.freq === 'monthly' ? ' / month' : ''}</dd></div>
    </dl>
    <p class="taxnote">${icon('shield', 'icon--sm')}<span>${esc(DATA.org.status)}</span></p>
    <p class="taxnote">${icon('lock', 'icon--sm')}<span>Payments are processed securely by Stripe. Card details never touch CRY America’s servers.</span></p>
  </div>`;
}
function donateStep() {
  const d = STATE.donate;
  const steps = ['Your gift', 'Your details', 'Payment'];
  const head = stepper(steps, d.step);
  if (d.step === 0) return `${head}${pat('cry/donation-form-full')}<form class="give-card" data-donate novalidate>
    <h2>Choose your gift</h2>
    ${/^project:/.test(d.designation) ? `${alertBox('info', `Dedicated funding for <b>${esc(designationLabel(d.designation))}</b> is a one-time gift of $2,500 or more. ${btn('Give to the general fund instead', { variant: 'tertiary', attrs: 'data-action="donate-general"' })}`, 'Project funding')}
    <fieldset style="margin-top:var(--wp--preset--spacing--20)"><legend>Amount</legend><div class="rcards" style="--min:120px">${PROJECT_AMOUNTS.map((v) => { const id = uid('da'); return `<div class="rcard"><input type="radio" name="d-amt" id="${id}" value="${v}" ${!d.other && v === d.amount ? 'checked' : ''}><label for="${id}"><b>${money(v)}</b></label><span class="rcard__tick">${icon('check')}</span></div>`; }).join('')}</div></fieldset>
    ${field({ id: 'd-other', label: 'Other amount', prefix: '$', value: d.other, placeholder: 'Enter amount', hint: 'Minimum $2,500.', attrs: `inputmode="decimal" data-min="${PROJECT_MIN}" data-d="other"` })}` : `${seg('d-freq', [{ value: 'once', label: 'One-time' }, { value: 'monthly', label: 'Monthly' }], { value: d.freq, block: true, label: 'Gift frequency' })}
    <fieldset style="margin-top:var(--wp--preset--spacing--20)"><legend>Amount</legend><div class="rcards" style="--min:120px">${AMOUNTS.map((a) => { const id = uid('da'); return `<div class="rcard"><input type="radio" name="d-amt" id="${id}" value="${a.v}" ${!d.other && a.v === d.amount ? 'checked' : ''}><label for="${id}"><b>$${a.v}</b><small>${esc(d.freq === 'monthly' ? a.monthly : a.once)}</small></label><span class="rcard__tick">${icon('check')}</span></div>`; }).join('')}</div></fieldset>
    ${field({ id: 'd-other', label: 'Other amount', prefix: '$', value: d.other, placeholder: 'Enter amount', hint: 'Minimum $5.', attrs: 'inputmode="decimal" data-min="5" data-d="other"' })}`}
    ${designationField('d', d.designation, d.ac || null)}
    ${check('Give in honor or in memory of someone', { checked: d.tribute, attrs: 'data-d="tribute" data-reveal="tribute"' })}
    <div class="reveal" data-reveal-box="tribute" ${d.tribute ? '' : 'hidden'}>
      ${seg('d-tt', [{ value: 'honor', label: 'In honor of' }, { value: 'memory', label: 'In memory of' }], { value: d.tributeType, label: 'Tribute type' })}
      <div class="field-row" style="margin-top:var(--wp--preset--spacing--20)">${field({ id: 'd-tname', label: 'Their name', value: d.tributeName, attrs: 'data-d="tributeName"' })}${field({ id: 'd-temail', label: 'Notify by email (optional)', type: 'email', value: d.tributeEmail, attrs: 'data-d="tributeEmail"' })}</div>
    </div>
    ${check('Cover the processing fee (about 3%) so 100% of my gift reaches children', { checked: d.fee, attrs: 'data-d="fee"' })}
    <div class="wizard-foot"><span></span>${btn('Continue', { type: 'submit', iconAfter: 'arrow-right' })}</div>

function matchResult(name) {
  const m = name && DATA.matchers.find(([n]) => n.toLowerCase() === name.trim().toLowerCase());

}
/* Read the current step's fields into STATE.donate */
function readDonate(form) {
  const d = STATE.donate;
  const v = (n) => { const el = form.querySelector(`[name="${n}"]:checked`); return el ? el.value : null; };
  if (v('d-freq')) d.freq = v('d-freq');
  if (v('d-amt')) d.amount = +v('d-amt');
  if (v('d-tt')) d.tributeType = v('d-tt');
  if (v('d-method')) d.method = v('d-method');
  const des = form.querySelector('#d-des'); if (des) d.designation = des.value;
  form.querySelectorAll('[data-d]').forEach((el) => { d[el.dataset.d] = el.type === 'checkbox' ? el.checked : el.value; });
}
function donateSubmit(form) {
  const d = STATE.donate;
  readDonate(form);
  const inputs = [...form.querySelectorAll('.input[required], .input[data-min]')];
  const ok = inputs.map(validateField).every(Boolean);
  if (!ok) { form.querySelector('[aria-invalid="true"]').focus(); toast('Please fix the highlighted fields.', 'error'); return; }
  if (d.step === 0 && !(d.other ? parseFloat(d.other) >= 5 : d.amount)) { toast('Choose an amount.', 'error'); return; }
  if (/^project:/.test(d.designation)) { d.freq = 'once'; const amt = d.other ? parseFloat(d.other) : d.amount; if (!(amt >= PROJECT_MIN)) { toast('Dedicated project funding starts at $2,500.', 'error'); return; } }
  if (d.step < 2) { d.step++; refreshDonate(); return; }
  if (d.decline) { location.hash = '#/give/payment-issue'; return; }
  const gift = { ...d, owner: STATE.role !== 'visitor' ? 'me' : null, total: giftTotal(d), date: TODAY, id: 'G-' + (1000 + Math.floor(Math.random() * 9000)) };
  STATE.gifts = (STATE.gifts || []).concat(gift);
  STATE.gift = gift;
  STATE.donate = null;
  location.hash = '#/give/thank-you';
}
function refreshDonate() {
  const host = document.querySelector('[data-donate-host]');
  host.innerHTML = donateStep();
  document.querySelector('[data-donate-summary]').innerHTML = donateSummary();

  host.scrollIntoView({ block: 'start', behavior: 'auto' });
}

    const d = { id: 'd-' + Date.now().toString(36), title: '', cat: 'walk', ac: roleScope() || 'houston', date: '', time: '9:00 am', venue: '', city: '', description: '', tickets: [{ id: 't1', name: 'Adult', price: 20, cap: 200, seats: 1 }], questions: [], waiver: '', goal: null, fundraising: false, sponsors: ['gold', 'community'], shifts: [], status: 'draft', submittedBy: actorName(), comment: '' };
    DATA.eventDrafts.push(d); STATE.ew = { id: d.id, step: 0 }; location.replace('#/manage/events/' + d.id + '/edit'); return d;
  }
  let d = draftOf(id);
  if (!d && eventOf(id)) {
    const e = eventOf(id);
    d = DATA.eventDrafts.find((x) => x.editOf === e.slug && x.status !== 'approved');
    if (!d) { d = { id: 'e-' + e.slug, editOf: e.slug, title: e.title, cat: e.cat, ac: e.ac, date: e.date, time: e.time, venue: e.venue, city: e.city, description: DATA.eventContent[e.cat].about, tickets: ticketsOf(e).map((t) => ({ ...t })), questions: (e.questions || []).slice(), waiver: e.waiver || '', goal: e.goal, fundraising: !!e.fundraising, sponsors: DATA.sponsorTiers.map((t) => t.id), shifts: [], status: 'draft', submittedBy: actorName(), comment: '' }; DATA.eventDrafts.push(d); }
  }
  return d;
}
function pageEventEdit(params) {
  const d = draftFor(params.id);

  if (!STATE.ew || STATE.ew.id !== d.id) STATE.ew = { id: d.id, step: d.status === 'pending' ? 8 : 0 };
  const live = d.editOf && eventOf(d.editOf);
  return `${manageHeader(d.editOf ? `Edit ${d.title}` : d.title || 'New event', d.editOf ? 'Changes to a live event go to a Super Admin before they are published.' : 'New events are reviewed by a Super Admin before they go live.', [[d.title || 'New event']])}
  <div class="wrap section--tight">${live ? manageTabs(live, 'edit') : ''}
    <div class="cluster" style="margin-bottom:var(--wp--preset--spacing--20)">${statusBadge(d.status === 'returned' ? 'returned' : d.status === 'pending' ? 'pending' : 'draft')}${d.status === 'returned' ? `<span class="muted">Returned with a comment: “${esc(d.comment)}”</span>` : ''}</div>
    <div data-ew-host>${ewStep(d)}</div></div>`;
}
const ROW_COLS = {
  tickets: [['name', 'Ticket name'], ['price', 'Price', 'money'], ['cap', 'Capacity', 'number'], ['seats', 'People per ticket', 'number']],
  questions: [['label', 'Question'], ['type', 'Answer type', 'select']],
  shifts: [['role', 'Role'], ['from', 'From'], ['to', 'To'], ['cap', 'Spots', 'number']],
  officers: [['first', 'First name'], ['last', 'Last name'], ['role', 'Role']],
};
function readRows(box, kind) {
  return [...box.querySelectorAll('.rows__row')].map((row, i) => Object.fromEntries(ROW_COLS[kind].map(([k]) => [k, (row.querySelector(`#ew-${kind}-${i}-${k}`) || {}).value || ''])));

function rowsEditor(list, kind, cols) {
  return `<div class="rows" data-rows="${kind}">${list.map((r, i) => `<div class="rows__row">${cols.map(([k, label, type]) => field({ id: `ew-${kind}-${i}-${k}`, label, type: type || 'text', value: r[k] != null ? String(r[k]) : '', prefix: type === 'money' ? '$' : '', options: type === 'select' ? ['text', 'select', 'checkbox'] : null, attrs: type === 'money' || type === 'number' ? 'inputmode="decimal"' : '' })).join('')}${btn('Remove', { variant: 'icon', icon: 'x', iconOnly: true, attrs: `data-action="ew-del" data-kind="${kind}" data-i="${i}" aria-label="Remove row ${i + 1}"` })}</div>`).join('') || '<p class="muted">None yet.</p>'}
    ${btn('Add', { variant: 'tertiary', icon: 'plus', attrs: `data-action="ew-add" data-kind="${kind}"` })}</div>`;
}
function ewStep(d) {
  const st = STATE.ew.step;
  const head = stepper(EW_STEPS, st);
  const ro = d.status === 'pending';
  const foot = (label) => `<div class="wizard-foot">${st ? btn('Back', { variant: 'secondary', icon: 'arrow-left', attrs: 'data-action="ew-back"' }) : '<span></span>'}${ro && st === 8 ? '' : btn(label || 'Save and continue', { type: 'submit', iconAfter: label ? '' : 'arrow-right', icon: label ? 'check' : '' })}</div>`;
  const clones = DATA.events.filter((e) => inScope(e.ac));
  if (st === 0) return `${head}${pat('cry/event-wizard')}<form class="give-card" data-ew novalidate><h2>Basics</h2>

    <div class="field-row">${field({ id: 'ew-cat', label: 'Category', type: 'select', options: DATA.categories.map((c) => c.name), value: catOf(d.cat).name })}${field({ id: 'ew-ac', label: 'Action Center', type: 'select', options: (roleScope() ? [acOf(roleScope())] : activeACs()).map((a) => a.name).concat(roleScope() ? [] : ['CRY America (national)']), value: d.ac ? acOf(d.ac).name : 'CRY America (national)', disabled: !!roleScope(), hint: roleScope() ? 'Coordinators create events for their own Action Center.' : '' })}</div>
    ${field({ id: 'ew-title', label: 'Event title', required: true, value: d.title, placeholder: 'e.g. CRY Houston Holi 2027' })}
    ${field({ id: 'ew-desc', label: 'Description', type: 'textarea', value: d.description })}
    ${upload({ label: 'Event photo (no text on the image; it is shown as a banner)', max: 1 })}${foot()}</form>`;
  if (st === 1) return `${head}<form class="give-card" data-ew novalidate><h2>Date and venue</h2>
    <div class="field-row">${field({ id: 'ew-date', label: 'Date', type: 'date', required: true, value: d.date })}${field({ id: 'ew-time', label: 'Start time', required: true, value: d.time, placeholder: '9:00 am' })}</div>
    <div class="field-row">${field({ id: 'ew-venue', label: 'Venue', required: true, value: d.venue })}${field({ id: 'ew-city', label: 'City and state', required: true, value: d.city, placeholder: 'Sugar Land, TX' })}</div>${foot()}</form>`;
  if (st === 2) return `${head}<form class="give-card" data-ew novalidate><h2>Tickets and bundles</h2><p class="muted">Bundles admit more than one person (for example a family of four or a table of ten).</p>
    ${rowsEditor(d.tickets, 'tickets', [['name', 'Ticket name'], ['price', 'Price', 'money'], ['cap', 'Capacity', 'number'], ['seats', 'People per ticket', 'number']])}<p class="field__error" id="ew-tix-e" hidden></p>${foot()}</form>`;
  if (st === 3) return `${head}<form class="give-card" data-ew novalidate><h2>Registration questions</h2><p class="muted">Asked for each attendee. Leave empty to use the ${esc(catOf(d.cat).name)} defaults: ${esc(DATA.eventContent[d.cat].questions.map((q) => q.label).join(', '))}.</p>
    ${rowsEditor(d.questions, 'questions', [['label', 'Question'], ['type', 'Answer type', 'select']])}${foot()}</form>`;
  if (st === 4) return `${head}<form class="give-card" data-ew novalidate><h2>Waiver</h2>${field({ id: 'ew-waiver', label: 'Waiver text', type: 'textarea', value: d.waiver || DATA.eventContent[d.cat].waiver, hint: 'Pre-filled with the approved template for this category.' })}${foot()}</form>`;
  if (st === 5) return `${head}<form class="give-card" data-ew novalidate><h2>Fundraising</h2>
    ${field({ id: 'ew-goal', label: 'Event fundraising goal (optional)', prefix: '$', value: d.goal ? String(d.goal) : '', hint: 'Leave empty for no goal; the event page then shows no meter.', attrs: 'inputmode="decimal"' })}
    ${check('Open peer-to-peer fundraising pages and teams for this event', { checked: d.fundraising, attrs: 'id="ew-fr"', sub: 'Normally Walks plus selected festivals; a Super Admin confirms on approval.' })}${foot()}</form>`;
  if (st === 6) return `${head}<form class="give-card" data-ew novalidate><h2>Sponsor levels</h2><fieldset><legend class="sr-only">Sponsor levels offered</legend>${DATA.sponsorTiers.map((t) => check(`${t.name} · ${money(t.price)}`, { checked: d.sponsors.includes(t.id), attrs: `name="ew-sp" value="${t.id}"`, sub: t.benefits.join(' · ') })).join('')}</fieldset>${foot()}</form>`;
  if (st === 7) return `${head}<form class="give-card" data-ew novalidate><h2>Volunteer shifts</h2><p class="muted">Leave empty to use the ${esc(catOf(d.cat).name)} template.</p>
    ${rowsEditor(d.shifts.map(([role, from, to, cap]) => ({ role, from, to, cap })), 'shifts', [['role', 'Role'], ['from', 'From'], ['to', 'To'], ['cap', 'Spots', 'number']])}${foot()}</form>`;
  const tix = d.tickets;
  return `${head}<form class="give-card stack" data-ew novalidate><h2>Review${ro ? '' : ' and submit'}</h2>
    <dl class="summary"><div><dt>Title</dt><dd>${esc(d.title || '—')}</dd></div><div><dt>Category</dt><dd>${esc(catOf(d.cat).name)}</dd></div><div><dt>Organized by</dt><dd>${d.ac ? esc(acOf(d.ac).name) + ' Action Center' : 'CRY America'}</dd></div><div><dt>When</dt><dd>${d.date ? fmtDate(d.date) : '—'} · ${esc(d.time)}</dd></div><div><dt>Where</dt><dd>${esc(d.venue || '—')}, ${esc(d.city || '')}</dd></div>

    ${ro ? alertBox('info', `Submitted ${fmtDate(d.submitted)} by ${esc(d.submittedBy)}. A Super Admin will approve it or return it with comments.`, 'Waiting for approval') : alertBox('info', 'When you submit, a Super Admin reviews the event. You get an email when it is approved or returned.')}
    ${foot(ro ? '' : d.editOf ? 'Submit changes for approval' : 'Submit for approval')}</form>`;

function ewRead(form, d) {
  const st = STATE.ew.step;
  const v = (id) => (form.querySelector('#' + id) || {}).value;
  const rows = (kind, keys) => [...form.querySelectorAll(`[data-rows="${kind}"] .rows__row`)].map((row, i) => Object.fromEntries(keys.map((k) => [k, (row.querySelector(`#ew-${kind}-${i}-${k}`) || {}).value || ''])));
  if (st === 0) {
    const cl = form.querySelector('#ew-clone');
    if (cl && cl.selectedIndex > 0) { const src = DATA.events.filter((e) => inScope(e.ac))[cl.selectedIndex - 1]; Object.assign(d, { cat: src.cat, ac: src.ac, time: src.time, venue: src.venue, city: src.city, tickets: ticketsOf(src).map((t) => ({ id: t.id, name: t.name, price: t.price, cap: t.cap, seats: t.seats || 1 })), goal: src.goal, fundraising: !!src.fundraising }); if (!v('ew-title')) d.title = src.title.replace(/20\d\d/, (y) => String(+y + 1)); }
    d.cat = DATA.categories.find((c) => c.name === v('ew-cat')).slug;
    if (!roleScope()) { const a = activeACs().find((x) => x.name === v('ew-ac')); d.ac = a ? a.slug : null; }
    d.title = v('ew-title') || d.title; d.description = v('ew-desc');
  }
  if (st === 1) Object.assign(d, { date: v('ew-date'), time: v('ew-time'), venue: v('ew-venue'), city: v('ew-city') });
  if (st === 2) d.tickets = rows('tickets', ['name', 'price', 'cap', 'seats']).map((t, i) => ({ id: 't' + (i + 1), name: t.name, price: parseFloat(t.price) || 0, cap: parseInt(t.cap, 10) || 100, seats: parseInt(t.seats, 10) || 1, kind: (parseInt(t.seats, 10) || 1) > 1 ? 'bundle' : undefined, sold: 0 }));
  if (st === 3) d.questions = rows('questions', ['label', 'type']).filter((q) => q.label).map((q, i) => ({ id: 'q' + (i + 1), label: q.label, type: q.type === 'select' ? 'select' : 'text', options: q.type === 'select' ? ['Yes', 'No'] : undefined }));
  if (st === 4) d.waiver = v('ew-waiver');
  if (st === 5) { d.goal = parseFloat(v('ew-goal')) || null; d.fundraising = form.querySelector('#ew-fr').checked; }
  if (st === 6) d.sponsors = [...form.querySelectorAll('[name="ew-sp"]:checked')].map((c) => c.value);
  if (st === 7) d.shifts = rows('shifts', ['role', 'from', 'to', 'cap']).filter((s) => s.role).map((s) => [s.role, s.from, s.to, parseInt(s.cap, 10) || 4]);
}
function ewSubmit(form) {
  const d = draftOf(STATE.ew.id);
  ewRead(form, d);
  const ok = [...form.querySelectorAll('.input[required]')].map(validateField).every(Boolean);
  if (!ok) { toast('Please fix the highlighted fields.', 'error'); form.querySelector('[aria-invalid="true"]').focus(); return; }
  if (STATE.ew.step === 2 && !d.tickets.filter((t) => t.name).length) { const er = form.querySelector('#ew-tix-e'); er.hidden = false; er.innerHTML = icon('x-circle', 'icon--sm') + 'Add at least one ticket.'; return; }
  if (STATE.ew.step < 8) { STATE.ew.step++; return ewRefresh(d); }
  if (!d.title || !d.date || !d.venue) { toast('Title, date and venue are needed before you submit.', 'error'); STATE.ew.step = !d.title ? 0 : 1; return ewRefresh(d); }
  d.status = 'pending'; d.submitted = TODAY; d.submittedBy = actorName(); d.comment = '';
  audit(d.editOf ? 'Submitted event changes' : 'Submitted new event', d.title);
  STATE.ew = null;
  location.hash = '#/manage';
  toast(`“${esc(d.title)}” is submitted for approval.`, 'success');
}
function ewRefresh(d) {
  const host = document.querySelector('[data-ew-host]');
  host.innerHTML = ewStep(d);
  const h = host.querySelector('h2'); h.setAttribute('tabindex', '-1'); h.focus(); host.scrollIntoView({ block: 'start' });
}

/* MO-07 Pledges */
function pageManagePledges(params) {
  const { e, html } = liveEventGuard(params.id); if (html) return html;

/* =====================================================================
   Stage 3 · News: listing (featured, topic filter, pagination) and article.
   ===================================================================== */
const NEWS_PER_PAGE = 9;

/* NS-01 News & Blog */
function pageNews() {
  const topic = STATE.query.topic || '';
  const page = Math.max(1, +(STATE.query.page || 1));
  const all = [...DATA.articles].sort((a, b) => b.date.localeCompare(a.date));
  const topics = [...new Set(all.map((a) => a.topic))].sort();
  const list = all.filter((a) => !topic || a.topic === topic);
  const featured = !topic && page === 1 ? list[0] : null;
  const rest = featured ? list.slice(1) : list;
  const pages = Math.max(1, Math.ceil(rest.length / NEWS_PER_PAGE));
  const shown = rest.slice((page - 1) * NEWS_PER_PAGE, page * NEWS_PER_PAGE);
  const qs = (o) => { const p = { topic, page, ...o }; const u = new URLSearchParams(); if (p.topic) u.set('topic', p.topic); if (p.page > 1) u.set('page', p.page); return '#/news' + (u.toString() ? '?' + u : ''); };
  return `${pageHeader({ title: 'News & stories', lead: 'Updates from CRY America, our partners and the communities we support.', crumbs: [['Home', '#/'], ['News']] })}
  <div class="wrap section--tight">
    ${featured ? `${pat('cry/featured-article')}<article class="featured-article card">
      <div class="cat-art cat-topic" style="--ar:16/9" role="img" aria-label="${esc(featured.topic)} illustration">${Array.from({ length: 5 }, () => `<span>${icon(featured.icon)}</span>`).join('')}</div>
      <div class="stack" style="padding:var(--wp--preset--spacing--30)"><span class="eyebrow">Latest · ${esc(featured.topic)}</span><h2><a class="card__link" href="#/news/${featured.slug}">${esc(featured.title)}</a></h2><p class="muted">${esc(featured.excerpt)}</p><time class="muted" datetime="${featured.date}">${fmtDate(featured.date, { month: 'long', day: 'numeric', year: 'numeric' })}</time></div>
    </article>` : ''}
    <nav class="chips" aria-label="Filter by topic" style="margin:var(--wp--preset--spacing--40) 0 var(--wp--preset--spacing--30)"><a class="chip" href="#/news" ${!topic ? 'aria-pressed="true"' : ''}>All topics</a>${topics.map((t) => `<a class="chip" href="${qs({ topic: t, page: 1 })}" ${topic === t ? 'aria-pressed="true"' : ''}>${esc(t)}</a>`).join('')}</nav>
    <div class="grid">${shown.map(cardArticle).join('')}</div>
    ${pages > 1 ? `${pat('cry/pagination')}<nav class="pager" aria-label="Pages">${page > 1 ? btn('Previous', { variant: 'secondary', icon: 'arrow-left', href: qs({ page: page - 1 }) }) : '<span></span>'}<span class="muted">Page ${page} of ${pages}</span>${page < pages ? btn('Next', { variant: 'secondary', iconAfter: 'arrow-right', href: qs({ page: page + 1 }) }) : '<span></span>'}</nav>` : ''}
  </div>
  <div class="wrap section--tight"><div class="give-card news-sub"><div><h2>Get stories of change by email</h2><p class="muted">About once a month. Unsubscribe any time.</p></div><form data-newsletter novalidate class="cluster">${field({ id: 'nw-email', label: 'Email address', type: 'email', placeholder: 'you@example.com', autocomplete: 'email' })}${btn('Subscribe', { type: 'submit' })}</form></div></div>`;
}

  return `<article>
  <header class="page-header"><div class="wrap wrap--content">${breadcrumbs([['Home', '#/'], ['News', '#/news'], [a.topic, `#/news?topic=${encodeURIComponent(a.topic)}`], ['Article']])}

    <div class="cluster muted"><span>By the CRY America team</span><span aria-hidden="true">·</span><time datetime="${a.date}">${fmtDate(a.date, { month: 'long', day: 'numeric', year: 'numeric' })}</time><span aria-hidden="true">·</span><span>5 min read</span></div></div></header>
  <div class="wrap wrap--content section--tight prose">
    <div class="cat-art cat-topic" style="--ar:16/9;--r:var(--wp--custom--radius--xl)" role="img" aria-label="${esc(a.topic)} illustration">${Array.from({ length: 5 }, () => `<span>${icon(a.icon)}</span>`).join('')}</div>
    <p class="lead" style="margin-top:var(--wp--preset--spacing--30)">${esc(a.excerpt)}</p>
    ${alertBox('info', `The article body migrates from <code>/blogs/${esc(a.slug)}/</code>. The slug is kept, and the old URL redirects here.`, 'Content to migrate')}
    <h2>Section heading</h2><p class="muted">Body paragraphs, images with captions, pull quotes and lists render here with the article styles.</p>
    <blockquote><p>Pull quotes use the heading font with a yellow rule.</p></blockquote>
    <div class="share">${['Facebook', 'LinkedIn', 'WhatsApp', 'Copy link'].map((n) => btn(n, { variant: 'secondary', size: 'sm', icon: 'share', attrs: 'data-action="share"' })).join('')}</div>
  </div>
  </article>
  <div class="wrap section--tight">${ctaBand({ id: 'ar-cta', title: 'Turn reading into action', text: 'A gift today helps a child claim their rights.', buttons: btn('Donate', { attrs: 'data-action="quick-give"' }) })}</div>
  <section class="section--tight" aria-labelledby="ar-rel"><div class="wrap"><h2 id="ar-rel">Related articles</h2><div class="grid">${more.map(cardArticle).join('')}</div></div></section>`;
