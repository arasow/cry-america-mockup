/* OW-03 Our Impact: single-series bar chart (one hue, value labels, table view) */

      { title: 'Table', body: `<div class="table-wrap"><table class="table"><thead><tr><th scope="col">${esc(rows.label || 'Item')}</th><th scope="col" class="num">Value</th></tr></thead><tbody>${rows.map((r) => `<tr><td>${esc(r.label)}</td><td class="num">${fmt(r.value)}</td></tr>`).join('')}</tbody></table></div>` },

/* OW-04 How We Fund Projects (Grants) */
function pageHowWeFund() {
  const S = [['search', 'Project selection', 'We look for grassroots organizations with deep community roots, working where children are most at risk. CRY India helps us visit and assess them.'], ['heart', 'Project funding', 'Grants cover programs, staff and community organizing, usually for several years so change can take hold.'], ['school', 'Capacity building & training', 'Partners get training in child rights, finance, governance and reporting, so they grow stronger.'], ['users', 'Community organization & government programs', 'Partners help communities claim the services they are entitled to, from schools that work to health centers that reach every child.']];
  return `${pageHeader({ title: 'How we fund projects', lead: 'From choosing a partner to tracking results each year.', crumbs: [['Home', '#/'], ['Our Work', '#/our-work'], ['How we fund']] })}
  <div class="wrap section--tight">
    <ol class="fund-steps">${S.map(([i, t, d], n) => `<li><span class="stat__ico">${icon(i)}</span><span class="eyebrow">Step ${n + 1}</span><h2>${esc(t)}</h2><p>${esc(d)}</p></li>`).join('')}</ol>
  </div>
  <section class="section section--alt" aria-labelledby="hf-toc"><div class="wrap wrap--content"><h2 id="hf-toc">CRY America’s theory of change</h2>
    ${accordion(DATA.about.change.map(([t, d], i) => ({ q: `${i + 1}. ${t}`, a: esc(d), open: i === 0 })))}
  </div></section>
  <div class="wrap section">${ctaBand({ id: 'hf-cta', title: 'Choose a project to fund', text: 'Every project page shows its story, budget and progress through the year.', buttons: btn('See all projects', { href: '#/projects' }) })}</div>`;
}

/* OW-05 Projects hub with filters */
function pageProjects() {
  const q = STATE.query;
  const list = DATA.projects.filter((p) => (!q.focus || p.focus === q.focus) && (!q.country || p.country === q.country) && (!q.state || p.state === q.state) && (!q.type || (q.type === 'direct' ? p.direct : p.kind === q.type)));
  const states = [...new Set(DATA.projects.map((p) => p.state).filter(Boolean))].sort();
  const sel = (name, label, opts) => `<div class="field"><label class="field__label" for="pf-${name}">${label}</label><select class="select" id="pf-${name}" data-filter="${name}"><option value="">All</option>${opts.map(([v, l]) => `<option value="${esc(v)}" ${q[name] === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div>`;
  return `${pageHeader({ title: 'Projects', lead: 'Support a partner project directly and follow its progress through the year.', crumbs: [['Home', '#/'], ['Our Work', '#/our-work'], ['Projects']] })}
  <div class="wrap section--tight">
    <div class="explainer">${icon('info')}<p><b>Dedicated project funding starts at $2,500.</b> Gifts of $2,500 or more can be dedicated to one partner project, and you receive its yearly report. Gifts of any size to the general fund support all projects where the need is greatest.</p></div>
    ${pat('cry/filters')}<form class="filters" data-filters aria-label="Filter projects">
      ${sel('focus', 'Focus area', DATA.focusAreas.map((f) => [f.slug, f.name]))}
      ${sel('country', 'Country', [['India', 'India'], ['USA', 'USA']])}
      ${sel('state', 'State', states.map((s) => [s, s]))}
      ${sel('type', 'Type', [['direct', 'Fund directly'], ['direct-intervention', 'Direct intervention'], ['us', 'US projects']])}
      ${Object.keys(q).some((k) => ['focus', 'country', 'state', 'type'].includes(k) && q[k]) ? btn('Clear filters', { variant: 'tertiary', href: '#/projects' }) : ''}
    </form>
    <p class="muted" role="status">${list.length} of ${DATA.projects.length} projects</p>
    ${list.length ? `<div class="grid">${list.map(cardProject).join('')}</div>` : `<div class="notice-page"><h2>No projects match</h2><p class="muted">Try removing a filter.</p>${btn('Clear filters', { variant: 'secondary', href: '#/projects' })}</div>`}
  </div>`;
}

/* Dedicated project funding (gifts of PROJECT_MIN or more) */
function projectFundForm(p) {
  return `${pat('cry/project-funding')}<form class="give-card" data-project-give="${p.slug}" novalidate>
    <h2>Fund this project directly</h2>
    <p class="muted">Dedicated project funding is for gifts of <b>$2,500 or more</b>. You will receive the project’s yearly report.</p>
    <fieldset><legend class="sr-only">Amount</legend><div class="rcards" style="--min:110px">${PROJECT_AMOUNTS.map((v, i) => { const id = uid('pf'); return `<div class="rcard"><input type="radio" name="pf-amt" id="${id}" value="${v}" ${i === 0 ? 'checked' : ''}><label for="${id}"><b>${money(v)}</b></label><span class="rcard__tick">${icon('check')}</span></div>`; }).join('')}</div></fieldset>
    ${field({ id: 'pf-other', label: 'Other amount', prefix: '$', hint: 'Minimum $2,500.', attrs: `inputmode="decimal" data-min="${PROJECT_MIN}"` })}
    ${btn('Continue', { type: 'submit', block: true, size: 'lg', iconAfter: 'arrow-right' })}
    <hr><p class="muted"><small>Giving less than $2,500? Your gift to the general fund supports this and every other project.</small></p>
    ${btn('Give any amount to the general fund', { variant: 'secondary', block: true, attrs: 'data-action="quick-give"' })}
  </form>`;
}

/* OW-06 Project profile */
function pageProject(params) {
  const p = projectOf(params.project);
  const f = focusOf(p.focus);
  const raised = ROLLUP.project(p);
  const years = Object.keys(p.history).sort().reverse();
  const related = DATA.projects.filter((x) => x.focus === p.focus && x.slug !== p.slug).slice(0, 3);
  const where = [p.state, p.country].filter(Boolean).join(', ');
  return `${pageHeader({ title: p.name, lead: [p.partner, where].filter(Boolean).map(esc).join(' · '), crumbs: [['Home', '#/'], ['Projects', '#/projects'], [p.name]] })}
  <div class="wrap section--tight"><div class="split">
    <div class="stack" style="--stack:var(--wp--preset--spacing--40)">
      ${p.img ? img(p.img, { ar: '16/9', cls: 'media--round' }) : categoryArtIcon(f.icon, '16/9')}
      <div class="cluster"><a class="tag" href="#/our-work/${f.slug}">${esc(f.name)}</a>${p.direct ? '<span class="tag">Fund directly</span>' : ''}${p.kind === 'direct-intervention' ? '<span class="tag">Direct intervention</span>' : ''}${p.kind === 'us' ? '<span class="tag">US project</span>' : ''}</div>
      ${p.story ? `<section aria-labelledby="pp-story"><span class="eyebrow">Story of change</span><h2 id="pp-story">${esc(p.story)}</h2></section>` : ''}
      ${alertBox('info', 'Problem, solution, impact and plans migrate from this project’s yearly report pages (2023–2026). The sections below show the structure.', 'Content to migrate')}
      ${[['The problem', f.problem], ['The solution', 'What the partner does with communities, families and local government.'], ['Impact so far', 'Key results from the latest report, with numbers.'], ['Plans for 2026', 'What the 2026 grant will fund.']].map(([h, t]) => `<section><h2>${esc(h)}</h2><p class="${h === 'The problem' ? '' : 'muted'}">${esc(t)}</p></section>`).join('')}
      <section aria-labelledby="pp-years"><h2 id="pp-years">Grant history</h2>
        ${years.length ? tabs('pp-y', years.map((y) => ({ title: y, body: `<div class="stat-row">${statTile({ icon: 'calendar', num: money(p.history[y]), label: y === '2026' ? '2026 grant approved' : `${y} grant disbursed` })}</div>` }))) : '<p class="muted">Grant figures will be published with the next project report.</p>'}
      </section>
      <section aria-labelledby="pp-video"><h2 id="pp-video" class="sr-only">Video</h2>${videoFeature({ id: '9EnhFfOPnFA', poster: p.img || 'pageBreaker', title: 'Inside a CRY partner project', text: 'See how partners work with children and communities.' })}</section>
    </div>
    <aside class="split__aside" aria-label="Support this project">
      <div class="give-card">${meter({ raised, goal: p.goal, donors: p.donations.length, label: p.name + ' funding' })}</div>
      ${projectFundForm(p)}
      ${btn('Share this project', { variant: 'secondary', block: true, icon: 'share', attrs: 'data-action="share"' })}
    </aside>
  </div></div>
  ${related.length ? `<section class="section section--alt" aria-labelledby="pp-rel"><div class="wrap"><h2 id="pp-rel">Related projects</h2><div class="grid">${related.map(cardProject).join('')}</div></div></section>` : ''}`;
}

/* Init: runs after app.js and every src/pages/*.js file. */
/* Init */
try { const v = localStorage.getItem('cry-variation'); if (v === 'dark' || v === 'light') STATE.variation = v; } catch (e) { /* storage blocked */ }
setVariation(STATE.variation);
render();

</script>
</body>
</html>
