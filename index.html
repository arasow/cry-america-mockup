.on-dark { background: var(--wp--preset--color--ink); color: var(--wp--preset--color--white); }

/* ---------- Dev bar (mock only) ---------- */

/* ---------- Header  >> template part: header · pattern: cry/header ---------- */

.site-brand:hover { color: var(--wp--preset--color--main); }
.site-brand__name { font-family: var(--wp--preset--font-family--heading); font-size: var(--wp--preset--font-size--large); font-weight: var(--wp--custom--font-weight--bold); letter-spacing: var(--wp--custom--letter-spacing--heading); line-height: 1; white-space: nowrap; }

.acct-btn { text-decoration: none; display: inline-flex; align-items: center; gap: var(--wp--preset--spacing--10); min-height: 2.5rem; padding: 0 var(--wp--preset--spacing--10) 0 4px; border: var(--wp--custom--control--border-width) solid var(--wp--preset--color--border-light); border-radius: var(--wp--custom--radius--pill); background: var(--wp--preset--color--surface); cursor: pointer; font-size: var(--wp--preset--font-size--small); font-weight: var(--wp--custom--font-weight--medium); color: var(--wp--preset--color--main); }

@media (max-width: 1280px) { .site-nav { display: none; } .menu-btn { display: inline-flex; } .site-header__actions { margin-left: auto; } }
.site-nav .cluster { flex-wrap: nowrap; }
.site-nav__btn, .site-nav__link, .acct-btn { white-space: nowrap; }
@media (max-width: 420px) { .site-header__actions .rel, .site-header__actions .acct-btn--signin { display: none; } }
@media (max-width: 560px) { .acct-btn__name, .hide-sm { display: none; } .site-header__bar { gap: var(--wp--preset--spacing--10); } }

/* Mega-menu  >> core/navigation submenu with pattern cry/mega-menu */
.mega { position: absolute; left: 0; right: 0; top: 100%; background: var(--wp--preset--color--surface); border-top: 1px solid var(--wp--preset--color--border-light); box-shadow: var(--wp--preset--shadow--lg); border-radius: 0 0 var(--wp--custom--radius--xl) var(--wp--custom--radius--xl); animation: drop var(--wp--custom--motion--base) var(--wp--custom--motion--ease); }

.mega__feature { background: var(--wp--preset--color--base-alt); border-radius: var(--wp--custom--radius--lg); padding: var(--wp--preset--spacing--20); }
.mega__feature .media { --r: var(--wp--custom--radius--md); margin-bottom: var(--wp--preset--spacing--20); }

/* Navigation drawer (mobile)  >> core/navigation overlay */
.drawer { position: fixed; inset: 0; z-index: 100; display: flex; justify-content: flex-end; }

@keyframes fade { from { opacity: 0; } }
.drawer__sheet { position: relative; width: min(100%, 420px); height: 100%; overflow-y: auto; background: var(--wp--preset--color--surface); box-shadow: var(--wp--preset--shadow--lg); animation: slide-in var(--wp--custom--motion--slow) var(--wp--custom--motion--ease); display: flex; flex-direction: column; }
@keyframes slide-in { from { transform: translateX(24px); opacity: 0; } }

.drawer__body { padding: 0 var(--wp--preset--spacing--30) var(--wp--preset--spacing--30); display: grid; gap: var(--wp--preset--spacing--20); }

.drawer__nav summary, .drawer__nav > a { display: flex; justify-content: space-between; align-items: center; min-height: 3.25rem; font-family: var(--wp--preset--font-family--heading); font-size: var(--wp--preset--font-size--large); font-weight: var(--wp--custom--font-weight--semibold); cursor: pointer; list-style: none; text-decoration: none; color: var(--wp--preset--color--main); }

.drawer__nav ul { list-style: none; margin: 0 0 var(--wp--preset--spacing--20); padding: 0; }
.drawer__nav li a { display: block; padding: var(--wp--preset--spacing--10) 0; color: var(--wp--preset--color--main); text-decoration: none; }
.drawer__nav li a:hover { text-decoration: underline; }

/* Account menu */
.menu-pop { position: absolute; right: 0; top: calc(100% + 8px); min-width: 15rem; background: var(--wp--preset--color--surface); border: 1px solid var(--wp--preset--color--border-light); border-radius: var(--wp--custom--radius--lg); box-shadow: var(--wp--preset--shadow--lg); padding: var(--wp--preset--spacing--10); z-index: 60; animation: drop var(--wp--custom--motion--base) var(--wp--custom--motion--ease); }

/* ---------- Footer  >> template part: footer ---------- */
.site-footer { background: var(--wp--preset--color--ink); color: var(--wp--preset--color--gray-300); padding-block: var(--wp--preset--spacing--70) var(--wp--preset--spacing--40); margin-top: var(--wp--preset--spacing--70); }

.footer-mid { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--wp--preset--spacing--30); align-items: center; border-top: 1px solid var(--wp--preset--color--ink-700); margin-top: var(--wp--preset--spacing--50); padding-top: var(--wp--preset--spacing--30); font-size: var(--wp--preset--font-size--small); }

.social { display: flex; gap: var(--wp--preset--spacing--10); }
.social a { width: 2.5rem; height: 2.5rem; display: grid; place-items: center; border-radius: 50%; background: var(--wp--preset--color--ink-800); }

@media (max-width: 900px) { .footer-top { grid-template-columns: 1fr 1fr; } .footer-top > :first-child { grid-column: 1 / -1; } }
@media (max-width: 480px) { .footer-top { grid-template-columns: 1fr; } }

/* ---------- Breadcrumbs  >> pattern: cry/breadcrumbs ---------- */
.breadcrumbs ol { list-style: none; display: flex; flex-wrap: wrap; gap: 4px; padding: 0; margin: 0; font-size: var(--wp--preset--font-size--small); color: var(--wp--preset--color--main-accent); }
.breadcrumbs li { display: inline-flex; align-items: center; gap: 4px; }

/* ---------- Tabs  >> pattern: cry/tabs (custom block) ---------- */
.tabs__list { display: flex; gap: 4px; padding: 4px; background: var(--wp--preset--color--base-alt); border-radius: var(--wp--custom--radius--pill); width: max-content; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.tabs__tab { min-height: 2.5rem; padding: 0 var(--wp--preset--spacing--30); border: 0; border-radius: var(--wp--custom--radius--pill); background: transparent; color: var(--wp--preset--color--main-accent); font-weight: var(--wp--custom--font-weight--bold); font-size: var(--wp--preset--font-size--small); cursor: pointer; white-space: nowrap; transition: background-color var(--wp--custom--motion--fast) var(--wp--custom--motion--ease), color var(--wp--custom--motion--fast) var(--wp--custom--motion--ease); }
.tabs__tab:hover { color: var(--wp--preset--color--main); }

.tabs__panel { padding-top: var(--wp--preset--spacing--30); }
.tabs__panel[hidden] { display: none; }

/* ---------- Accordion  >> core/details ---------- */
.accordion { border-top: 1px solid var(--wp--preset--color--border-light); }
.accordion details { border-bottom: 1px solid var(--wp--preset--color--border-light); }
.accordion summary { display: flex; justify-content: space-between; align-items: center; gap: var(--wp--preset--spacing--20); padding: var(--wp--preset--spacing--20) 0; cursor: pointer; list-style: none; font-family: var(--wp--preset--font-family--heading); font-size: var(--wp--preset--font-size--medium); font-weight: var(--wp--custom--font-weight--semibold); }
.accordion summary::-webkit-details-marker { display: none; }
.accordion summary .acc-ico { width: 2rem; height: 2rem; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--wp--preset--color--base-alt); transition: transform var(--wp--custom--motion--base) var(--wp--custom--motion--ease), background-color var(--wp--custom--motion--fast) var(--wp--custom--motion--ease); }
.accordion details[open] summary .acc-ico { transform: rotate(45deg); background: var(--wp--preset--color--primary); color: var(--wp--preset--color--on-primary); }
.accordion .acc-body { padding: 0 var(--wp--preset--spacing--50) var(--wp--preset--spacing--30) 0; color: var(--wp--preset--color--main-accent); }

/* ---------- Modal + slide-in panel  >> pattern: cry/modal, template part: quick-give ---------- */
dialog { border: 0; padding: 0; color: var(--wp--preset--color--main); background: var(--wp--preset--color--surface); }
.modal { width: min(560px, calc(100% - 2rem)); max-height: calc(100% - 2rem); border-radius: var(--wp--custom--radius--xl); box-shadow: var(--wp--preset--shadow--lg); }
.modal[open] { animation: pop var(--wp--custom--motion--slow) var(--wp--custom--motion--ease); }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(0.98); } }
.modal__head, .panel__head { display: flex; align-items: center; justify-content: space-between; gap: var(--wp--preset--spacing--20); padding: var(--wp--preset--spacing--30) var(--wp--preset--spacing--30) var(--wp--preset--spacing--10); }

.modal__body, .panel__body { padding: var(--wp--preset--spacing--10) var(--wp--preset--spacing--30) var(--wp--preset--spacing--30); }
.modal__foot { display: flex; justify-content: flex-end; gap: var(--wp--preset--spacing--10); padding: var(--wp--preset--spacing--20) var(--wp--preset--spacing--30); border-top: 1px solid var(--wp--preset--color--border-light); }
.panel { position: fixed; inset: 0 0 0 auto; margin: 0 0 0 auto; width: min(460px, 100%); height: 100%; max-height: 100%; border-radius: var(--wp--custom--radius--xl) 0 0 var(--wp--custom--radius--xl); box-shadow: var(--wp--preset--shadow--lg); overflow-y: auto; }

@media (max-width: 480px) { .panel { border-radius: 0; } }

/* ---------- Toast  >> (runtime UI, not a block) ---------- */
.toast-region { position: fixed; z-index: 120; right: var(--wp--preset--spacing--20); bottom: var(--wp--preset--spacing--20); display: grid; gap: var(--wp--preset--spacing--10); width: min(380px, calc(100% - 2rem)); pointer-events: none; }
.toast { pointer-events: auto; display: flex; gap: var(--wp--preset--spacing--20); align-items: flex-start; padding: var(--wp--preset--spacing--20); background: var(--wp--preset--color--ink); color: var(--wp--preset--color--white); border-radius: var(--wp--custom--radius--lg); box-shadow: var(--wp--preset--shadow--lg); font-size: var(--wp--preset--font-size--small); animation: pop var(--wp--custom--motion--slow) var(--wp--custom--motion--ease); }
.toast .icon { color: var(--wp--preset--color--brand-yellow); margin-top: 2px; }
.toast--error .icon { color: var(--wp--preset--color--error-300); }

/* ---------- Badges, status, tags, alerts  >> core/paragraph block styles: is-style-badge-* ---------- */

.badge__dot { width: 1.25rem; height: 1.25rem; display: grid; place-items: center; border-radius: 50%; background: var(--cat-bg); color: var(--cat-fg); }
.badge__dot .icon { width: 0.75rem; height: 0.75rem; }
.cat-walk { --cat-bg: var(--wp--preset--color--teal); --cat-fg: var(--wp--preset--color--ink); --cat-tint: var(--wp--preset--color--teal-50); --cat-line: var(--wp--preset--color--teal); }
.cat-gala { --cat-bg: var(--wp--preset--color--ink); --cat-fg: var(--wp--preset--color--brand-yellow); --cat-tint: var(--wp--preset--color--gray-200); --cat-line: var(--wp--preset--color--ink); }
.cat-holi { --cat-bg: var(--wp--preset--color--plum); --cat-fg: var(--wp--preset--color--white); --cat-tint: var(--wp--preset--color--plum-50); --cat-line: var(--wp--preset--color--plum); }
.cat-dandiya { --cat-bg: var(--wp--preset--color--brand-yellow); --cat-fg: var(--wp--preset--color--ink); --cat-tint: var(--wp--preset--color--yellow-50); --cat-line: var(--wp--preset--color--brand-yellow); }
.cat-other { --cat-bg: var(--wp--preset--color--ink-soft); --cat-fg: var(--wp--preset--color--white); --cat-tint: var(--wp--preset--color--gray-50); --cat-line: var(--wp--preset--color--gray-500); }
[data-variation="dark"] .cat-gala, .is-style-section-dark .cat-gala { --cat-bg: var(--wp--preset--color--brand-yellow); --cat-fg: var(--wp--preset--color--ink); --cat-line: var(--wp--preset--color--brand-yellow); }
.status { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: var(--wp--custom--radius--pill); font-size: var(--wp--preset--font-size--small); font-weight: var(--wp--custom--font-weight--bold); line-height: 1.3; border: 1.5px solid transparent; white-space: nowrap; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.status--draft { background: var(--wp--preset--color--gray-50); color: var(--wp--preset--color--ink-soft); border-color: var(--wp--preset--color--gray-300); border-style: dashed; }
.status--pending { background: var(--wp--preset--color--yellow-50); color: var(--wp--preset--color--ink); border-color: var(--wp--preset--color--yellow-700); }

.status--returned { background: var(--wp--preset--color--error-50); color: var(--wp--preset--color--error); border-color: var(--wp--preset--color--error); }

.status--archived::before { border-radius: 2px; }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: var(--wp--custom--radius--xs); background: var(--wp--preset--color--base-alt); color: var(--wp--preset--color--main); border: 1px solid var(--wp--preset--color--border-light); font-size: var(--wp--preset--font-size--small); text-decoration: none; }
a.tag:hover { border-color: var(--wp--preset--color--border-dark); color: var(--wp--preset--color--main); }
.alert { display: flex; gap: var(--wp--preset--spacing--20); padding: var(--wp--preset--spacing--20); border-radius: var(--wp--custom--radius--md); border: 1.5px solid; color: var(--wp--preset--color--ink); font-size: var(--wp--preset--font-size--small); }
.alert p { margin: 0; }
.alert .icon { margin-top: 2px; }
.alert--info { background: var(--wp--preset--color--teal-50); border-color: var(--wp--preset--color--teal); }
.alert--info .icon { color: var(--wp--preset--color--teal-700); }
.alert--success { background: var(--wp--preset--color--success-50); border-color: var(--wp--preset--color--success); }

.alert--warning { background: var(--wp--preset--color--yellow-50); border-color: var(--wp--preset--color--yellow-700); }
.alert--warning .icon { color: var(--wp--preset--color--ink); }
.alert--error { background: var(--wp--preset--color--error-50); border-color: var(--wp--preset--color--error); }
.alert--error .icon { color: var(--wp--preset--color--error); }

/* Filter chips (category filters)  >> pattern: cry/filters */
.chips { display: flex; flex-wrap: wrap; gap: var(--wp--preset--spacing--10); }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 2.5rem; padding: 0 var(--wp--preset--spacing--20) 0 6px; border-radius: var(--wp--custom--radius--pill); border: var(--wp--custom--control--border-width) solid var(--wp--preset--color--border-dark); background: var(--wp--preset--color--surface); color: var(--wp--preset--color--main); font-size: var(--wp--preset--font-size--small); font-weight: var(--wp--custom--font-weight--bold); cursor: pointer; }
.chip:not(:has(.badge__dot)) { padding-left: var(--wp--preset--spacing--20); }
.chip:hover { border-color: var(--wp--preset--color--main); }
.chip[aria-pressed="true"] { background: var(--cat-tint, var(--wp--preset--color--selected)); color: var(--wp--preset--color--ink); border-color: var(--wp--preset--color--ink); box-shadow: inset 0 0 0 1px var(--wp--preset--color--ink); }
.chip__check { display: none; }
.chip[aria-pressed="true"] .chip__check { display: block; }

/* ---------- Avatars ---------- */
.avatar { --size: 2.75rem; width: var(--size); height: var(--size); flex: none; border-radius: 50%; display: grid; place-items: center; overflow: hidden; background: var(--av-bg, var(--wp--preset--color--teal-50)); color: var(--av-fg, var(--wp--preset--color--ink)); font-family: var(--wp--preset--font-family--heading); font-weight: var(--wp--custom--font-weight--semibold); font-size: var(--wp--preset--font-size--small); box-shadow: inset 0 0 0 2px var(--av-ring, var(--wp--preset--color--teal)); }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar--lg { --size: 4.5rem; font-size: var(--wp--preset--font-size--large); }
.avatar--xl { --size: 6rem; font-size: var(--wp--preset--font-size--x-large); }
.avatar--sm { --size: 2rem; }
.av-1 { --av-bg: var(--wp--preset--color--teal-50); --av-ring: var(--wp--preset--color--teal); }
.av-2 { --av-bg: var(--wp--preset--color--yellow-50); --av-ring: var(--wp--preset--color--brand-yellow); }
.av-3 { --av-bg: var(--wp--preset--color--plum-50); --av-ring: var(--wp--preset--color--plum); }
.av-4 { --av-bg: var(--wp--preset--color--gray-50); --av-ring: var(--wp--preset--color--gray-500); }
.avatar-stack { display: flex; }
.avatar-stack .avatar { --size: 2rem; margin-left: -8px; border: 2px solid var(--wp--preset--color--surface); }
.avatar-stack .avatar:first-child { margin-left: 0; }

/* ---------- Cards (shared shell)  >> core/group is-style-card ---------- */
.card { position: relative; display: flex; flex-direction: column; background: var(--wp--preset--color--surface); border-radius: var(--wp--custom--radius--lg); box-shadow: var(--wp--preset--shadow--md); padding: var(--wp--preset--spacing--10); transition: transform var(--wp--custom--motion--base) var(--wp--custom--motion--ease), box-shadow var(--wp--custom--motion--base) var(--wp--custom--motion--ease); color: var(--wp--preset--color--main); }
.card:has(.card__link:hover), .card.is-hoverable:hover { transform: translateY(-3px); box-shadow: var(--wp--preset--shadow--lg); }
.card .media { --r: var(--wp--custom--radius--md); }
.card__body { display: flex; flex-direction: column; gap: var(--wp--preset--spacing--10); padding: var(--wp--preset--spacing--20) var(--wp--preset--spacing--10) var(--wp--preset--spacing--10); flex: 1; }
.card__title { margin: 0; font-size: var(--wp--preset--font-size--large); }
.card__title a, .card__link { color: inherit; text-decoration: none; }
.card__link::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
.card__link:focus-visible { outline: none; }
.card:has(.card__link:focus-visible) { outline: 3px solid var(--wp--preset--color--main); outline-offset: 3px; }
.card__meta { display: flex; flex-wrap: wrap; gap: 4px var(--wp--preset--spacing--20); font-size: var(--wp--preset--font-size--small); color: var(--wp--preset--color--main-accent); }
.card__meta span { display: inline-flex; align-items: center; gap: 4px; }
.card__foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--wp--preset--spacing--20); margin-top: auto; padding-top: var(--wp--preset--spacing--10); }
.card__foot .btn, .card__foot a.btn { position: relative; z-index: 1; }
.card__desc { margin: 0; color: var(--wp--preset--color--main-accent); font-size: var(--wp--preset--font-size--small); }
.card--flat { box-shadow: none; border: 1px solid var(--wp--preset--color--border-light); }
.card--pad { padding: var(--wp--preset--spacing--30); }

/* Event card  >> pattern: cry/card-event */
.card-event__top { position: relative; }
.date-chip { position: absolute; top: var(--wp--preset--spacing--10); left: var(--wp--preset--spacing--10); min-width: 3.25rem; background: var(--wp--preset--color--white); color: var(--wp--preset--color--ink); border-radius: var(--wp--custom--radius--sm); padding: 0 6px 6px; text-align: center; line-height: 1; box-shadow: var(--wp--preset--shadow--sm); border-top: 5px solid var(--cat-line, var(--wp--preset--color--brand-yellow)); }
.date-chip b { display: block; font-family: var(--wp--preset--font-family--heading); font-size: var(--wp--preset--font-size--large); font-weight: var(--wp--custom--font-weight--semibold); padding-top: 6px; }
.date-chip span { font-size: var(--wp--preset--font-size--small); font-weight: var(--wp--custom--font-weight--bold); text-transform: uppercase; letter-spacing: var(--wp--custom--letter-spacing--caps); }
.card-event .card__foot strong { font-family: var(--wp--preset--font-family--heading); font-weight: var(--wp--custom--font-weight--semibold); }

/* Project card */
.card-project .meter { margin-top: var(--wp--preset--spacing--10); }

/* Fundraiser card */
.card-fundraiser__who { display: flex; gap: var(--wp--preset--spacing--20); align-items: center; padding: var(--wp--preset--spacing--10); }
.card-fundraiser__who h3 { margin: 0; font-size: var(--wp--preset--font-size--medium); }

/* Team card */
.card-team__head { display: flex; gap: var(--wp--preset--spacing--20); align-items: center; }
.team-mark { width: 3.5rem; height: 3.5rem; flex: none; border-radius: var(--wp--custom--radius--md); display: grid; place-items: center; background: var(--wp--preset--gradient--sunrise); color: var(--wp--preset--color--ink); font-family: var(--wp--preset--font-family--heading); font-weight: var(--wp--custom--font-weight--bold); font-size: var(--wp--preset--font-size--medium); }

/* Action Center card */
.card-ac .media { --ar: 16 / 9; }
.card-ac__city { display: flex; justify-content: space-between; align-items: center; gap: var(--wp--preset--spacing--10); }

/* Article + story cards */
.card-article .media { --ar: 16 / 9; }
.card-story { background: var(--wp--preset--color--yellow-50); color: var(--wp--preset--color--ink); box-shadow: none; }
.card-story blockquote { margin: 0; font-family: var(--wp--preset--font-family--heading); font-size: var(--wp--preset--font-size--large); line-height: var(--wp--custom--line-height--snug); font-weight: var(--wp--custom--font-weight--medium); }
.card-story .card__body { padding: var(--wp--preset--spacing--20); }

/* Stat tile  >> pattern: cry/stat-row */
.stat { display: grid; gap: 6px; align-content: start; padding: var(--wp--preset--spacing--30); border-radius: var(--wp--custom--radius--lg); background: var(--wp--preset--color--surface); box-shadow: var(--wp--preset--shadow--sm); }
.stat__ico { width: 3rem; height: 3rem; display: grid; place-items: center; border-radius: var(--wp--custom--radius--md); background: var(--wp--preset--color--yellow-50); color: var(--wp--preset--color--ink); margin-bottom: var(--wp--preset--spacing--10); }
.stat__ico .icon { width: 1.5rem; height: 1.5rem; }
.stat__num { font-family: var(--wp--preset--font-family--heading); font-size: var(--wp--preset--font-size--xx-large); font-weight: var(--wp--custom--font-weight--bold); line-height: 1; letter-spacing: var(--wp--custom--letter-spacing--display); }
.stat__label { color: var(--wp--preset--color--main-accent); font-size: var(--wp--preset--font-size--small); }
.stat-row { display: grid; gap: var(--wp--preset--spacing--20); grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }

/* Testimonial  >> pattern: cry/testimonial */
.testimonial { display: grid; gap: var(--wp--preset--spacing--20); padding: var(--wp--preset--spacing--40); border-radius: var(--wp--custom--radius--xl); background: var(--wp--preset--color--surface); box-shadow: var(--wp--preset--shadow--md); }
.testimonial__mark { width: 2.75rem; height: 2.75rem; color: var(--wp--preset--color--brand-yellow); }
.testimonial blockquote { margin: 0; font-family: var(--wp--preset--font-family--heading); font-size: var(--wp--preset--font-size--large); line-height: var(--wp--custom--line-height--snug); font-weight: var(--wp--custom--font-weight--medium); }
.testimonial figcaption { display: flex; gap: var(--wp--preset--spacing--20); align-items: center; font-size: var(--wp--preset--font-size--small); }
.testimonial figcaption b { display: block; font-size: var(--wp--preset--font-size--base); }
.testimonial--feature { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); align-items: center; gap: var(--wp--preset--spacing--50); background: var(--wp--preset--gradient--warm-wash); color: var(--wp--preset--color--ink); box-shadow: none; }
.testimonial--feature blockquote { font-size: var(--wp--preset--font-size--x-large); color: var(--wp--preset--color--ink); }
.testimonial--feature .media { --r: var(--wp--custom--radius--lg); --ar: 4 / 5; }
@media (max-width: 760px) { .testimonial--feature { grid-template-columns: 1fr; } .testimonial--feature .media { --ar: 4 / 3; } }

/* Person / officer card  >> pattern: cry/card-person */
.person { display: grid; justify-items: center; text-align: center; gap: var(--wp--preset--spacing--10); padding: var(--wp--preset--spacing--30) var(--wp--preset--spacing--20); border-radius: var(--wp--custom--radius--lg); background: var(--wp--preset--color--surface); box-shadow: var(--wp--preset--shadow--sm); }
.person h3 { margin: var(--wp--preset--spacing--10) 0 0; font-size: var(--wp--preset--font-size--medium); }
.person__role { font-size: var(--wp--preset--font-size--small); font-weight: var(--wp--custom--font-weight--bold); color: var(--wp--preset--color--accent-text); }
.person p { margin: 0; font-size: var(--wp--preset--font-size--small); color: var(--wp--preset--color--main-accent); }
.person .btn { margin-top: var(--wp--preset--spacing--10); }

/* ---------- Progress / thermometer  >> pattern: cry/progress (custom block cry/goal-meter) ---------- */
.meter { display: grid; gap: var(--wp--preset--spacing--10); }
.meter__nums { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px var(--wp--preset--spacing--10); }
.meter__raised { font-family: var(--wp--preset--font-family--heading); font-size: var(--wp--preset--font-size--x-large); font-weight: var(--wp--custom--font-weight--bold); line-height: 1; letter-spacing: var(--wp--custom--letter-spacing--heading); }
.meter__goal { color: var(--wp--preset--color--main-accent); font-size: var(--wp--preset--font-size--small); }
.meter__bar { position: relative; height: 0.75rem; border-radius: var(--wp--custom--radius--pill); background: var(--wp--preset--color--border-light); overflow: hidden; }
.meter__bar > span { position: absolute; inset: 0 auto 0 0; width: var(--pct); max-width: 100%; border-radius: inherit; background: var(--wp--preset--color--teal-700); }
[data-variation="dark"] .meter__bar > span, .is-style-section-dark .meter__bar > span { background: var(--wp--preset--color--brand-yellow); }
.meter__bar.is-over > span { background: var(--wp--preset--color--success); }
.meter__foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px var(--wp--preset--spacing--20); font-size: var(--wp--preset--font-size--small); color: var(--wp--preset--color--main-accent); }
.meter__foot b { color: var(--wp--preset--color--main); }
.meter--sm .meter__raised { font-size: var(--wp--preset--font-size--large); }
.meter--sm .meter__bar { height: 0.5rem; }
.meter--nogoal .meter__raised { font-size: var(--wp--preset--font-size--x-large); }
/* National rollup: one bar segmented by city event */
.meter--national { padding: var(--wp--preset--spacing--30); border-radius: var(--wp--custom--radius--xl); background: var(--wp--preset--color--surface); box-shadow: var(--wp--preset--shadow--md); }
.meter--national .meter__bar { height: 1.25rem; display: flex; }
.meter--national .meter__bar > span { position: static; border-radius: 0; flex: none; width: var(--w); background: var(--seg); border-right: 2px solid var(--wp--preset--color--surface); }
.seg-1 { --seg: var(--wp--preset--color--teal-700); } .seg-2 { --seg: var(--wp--preset--color--plum); } .seg-3 { --seg: var(--wp--preset--color--yellow-700); } .seg-4 { --seg: var(--wp--preset--color--ink-soft); } .seg-5 { --seg: var(--wp--preset--color--teal); } .seg-6 { --seg: var(--wp--preset--color--plum-700); }
.legend { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 6px var(--wp--preset--spacing--20); font-size: var(--wp--preset--font-size--small); }
.legend li { display: flex; align-items: center; gap: var(--wp--preset--spacing--10); }
.legend i { width: 0.75rem; height: 0.75rem; border-radius: 3px; background: var(--seg); flex: none; }
.legend b { margin-left: auto; font-variant-numeric: tabular-nums; }

/* ---------- Leaderboard  >> pattern: cry/leaderboard ---------- */
.leaderboard { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; counter-reset: rank; }
.leaderboard li { display: grid; grid-template-columns: 2rem auto minmax(0, 1fr) auto; gap: var(--wp--preset--spacing--20); align-items: center; padding: var(--wp--preset--spacing--10); border-radius: var(--wp--custom--radius--md); }
.leaderboard li:nth-child(odd) { background: var(--wp--preset--color--base-alt); }
.leaderboard__rank { width: 2rem; height: 2rem; display: grid; place-items: center; border-radius: 50%; font-family: var(--wp--preset--font-family--heading); font-weight: var(--wp--custom--font-weight--bold); font-size: var(--wp--preset--font-size--small); }
.leaderboard li:nth-child(1) .leaderboard__rank { background: var(--wp--preset--color--brand-yellow); color: var(--wp--preset--color--ink); }
.leaderboard li:nth-child(2) .leaderboard__rank { background: var(--wp--preset--color--gray-200); color: var(--wp--preset--color--ink); }
.leaderboard li:nth-child(3) .leaderboard__rank { background: var(--wp--preset--color--yellow-50); color: var(--wp--preset--color--ink); box-shadow: inset 0 0 0 1.5px var(--wp--preset--color--yellow-700); }
.leaderboard__name { min-width: 0; }
.leaderboard__name a { color: var(--wp--preset--color--main); font-weight: var(--wp--custom--font-weight--bold); text-decoration: none; }
.leaderboard__name a:hover { text-decoration: underline; }
.leaderboard__name small { display: block; color: var(--wp--preset--color--main-accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.leaderboard__amt { font-family: var(--wp--preset--font-family--heading); font-weight: var(--wp--custom--font-weight--semibold); font-variant-numeric: tabular-nums; }

/* ---------- Tables (donor table, data tables)  >> core/table is-style-cry ---------- */
.table-wrap { position: relative; overflow-x: auto; border-radius: var(--wp--custom--radius--lg); border: 1px solid var(--wp--preset--color--border-light); background: var(--wp--preset--color--surface); }
.table { width: 100%; border-collapse: collapse; font-size: var(--wp--preset--font-size--small); }
.table caption { text-align: left; padding: var(--wp--preset--spacing--20); font-family: var(--wp--preset--font-family--heading); font-size: var(--wp--preset--font-size--medium); font-weight: var(--wp--custom--font-weight--semibold); }
.table th, .table td { padding: 0.75rem var(--wp--preset--spacing--20); text-align: left; vertical-align: top; border-top: 1px solid var(--wp--preset--color--border-light); }
.table thead th { background: var(--wp--preset--color--base-alt); font-weight: var(--wp--custom--font-weight--bold); color: var(--wp--preset--color--main-accent); white-space: nowrap; }
.table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.table tfoot td, .table tfoot th { font-weight: var(--wp--custom--font-weight--bold); background: var(--wp--preset--color--selected); color: var(--wp--preset--color--main); }
.table tbody tr:hover { background: var(--wp--preset--color--base-alt); }
.donor-msg { display: block; color: var(--wp--preset--color--main-accent); font-style: italic; }

/* ---------- Forms  >> Gravity/blocks styled via theme ---------- */
.field { display: grid; gap: 6px; margin-bottom: var(--wp--preset--spacing--20); }
.field__label { font-weight: var(--wp--custom--font-weight--bold); font-size: var(--wp--preset--font-size--small); }
.field__label .req { color: var(--wp--preset--color--error-text); }
.field__hint { font-size: var(--wp--preset--font-size--small); color: var(--wp--preset--color--main-accent); margin: 0; }
.field__error, .field__ok { display: flex; align-items: center; gap: 6px; font-size: var(--wp--preset--font-size--small); font-weight: var(--wp--custom--font-weight--medium); margin: 0; }
.field__error { color: var(--wp--preset--color--error-text); }
.field__ok { color: var(--wp--preset--color--success-text); }
.input, .select, .textarea { width: 100%; min-height: var(--wp--custom--control--height); padding: 0 var(--wp--preset--spacing--20); border: var(--wp--custom--control--border-width) solid var(--wp--preset--color--border-dark); border-radius: var(--wp--custom--radius--md); background: var(--wp--preset--color--surface); color: var(--wp--preset--color--main); font-size: var(--wp--preset--font-size--base); transition: border-color var(--wp--custom--motion--fast) var(--wp--custom--motion--ease), box-shadow var(--wp--custom--motion--fast) var(--wp--custom--motion--ease); }

/* ---------- Heroes ---------- */

.hero-split { position: relative; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.9fr); gap: var(--wp--preset--spacing--50); align-items: center; padding: var(--wp--preset--spacing--60); border-radius: var(--wp--custom--radius--xl); background: var(--wp--preset--color--yellow-50); color: var(--wp--preset--color--ink); overflow: hidden; }

@media (max-width: 760px) { .hero-banner__body { grid-template-columns: 1fr; } }

/* Hero C, compact page header  >> pattern: cry/page-header */
.page-header { padding-block: var(--wp--preset--spacing--50) var(--wp--preset--spacing--40); background: var(--wp--preset--gradient--teal-wash); }

.cta-band h2 { color: var(--wp--preset--color--ink); margin-bottom: var(--wp--preset--spacing--10); }
.cta-band p { margin: 0; max-width: 52ch; }

@media (max-width: 760px) { .cta-band { grid-template-columns: 1fr; padding: var(--wp--preset--spacing--40) var(--wp--preset--spacing--30); } }

/* ---------- Gallery  >> core/gallery is-style-cry-mosaic ---------- */
.gallery { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--wp--preset--spacing--10); }

.video__play:hover span { transform: scale(1.04); }
.video__play:focus-visible span { outline: 3px solid var(--wp--preset--color--brand-yellow); outline-offset: 3px; }
.video-feature { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: var(--wp--preset--spacing--50); align-items: center; }
@media (max-width: 860px) { .video-feature { grid-template-columns: 1fr; } }

/* ---------- Sponsor logo strip  >> pattern: cry/logo-strip ---------- */
.logo-strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 200px)); gap: var(--wp--preset--spacing--20); align-items: center; }
.logo-tile { aspect-ratio: 3 / 2; display: grid; place-items: center; text-align: center; padding: var(--wp--preset--spacing--10); border-radius: var(--wp--custom--radius--md); border: 1px dashed var(--wp--preset--color--border-dark); color: var(--wp--preset--color--main-accent); font-size: var(--wp--preset--font-size--small); font-weight: var(--wp--custom--font-weight--bold); }
.logo-tier { display: flex; align-items: center; gap: var(--wp--preset--spacing--20); margin: var(--wp--preset--spacing--30) 0 var(--wp--preset--spacing--10); font-size: var(--wp--preset--font-size--small); font-weight: var(--wp--custom--font-weight--bold); text-transform: uppercase; letter-spacing: var(--wp--custom--letter-spacing--caps); color: var(--wp--preset--color--main-accent); }
.logo-tier::after { content: ""; flex: 1; height: 1px; background: var(--wp--preset--color--border-light); }

/* Category artwork (text-free banner when no suitable photo exists)  >> pattern: cry/category-art */
.cat-art { position: relative; aspect-ratio: var(--ar, 21 / 8); overflow: hidden; border-radius: var(--r, var(--wp--custom--radius--md)); background: var(--cat-tint); color: var(--cat-line); }
.cat-walk.cat-art { background: var(--wp--preset--gradient--teal-wash); }
.cat-holi.cat-art, .cat-dandiya.cat-art { background: var(--wp--preset--gradient--festival); }
.cat-gala.cat-art { background: var(--wp--preset--gradient--night); color: var(--wp--preset--color--brand-yellow); }
.cat-art span { position: absolute; display: grid; place-items: center; aspect-ratio: 1; border-radius: 50%; background: var(--wp--preset--color--white); opacity: 0.75; }
.cat-art span:nth-child(1) { left: 5%; top: 16%; width: 18%; }
.cat-art span:nth-child(2) { left: 27%; top: 54%; width: 12%; }
.cat-art span:nth-child(3) { left: 44%; top: 12%; width: 22%; }
.cat-art span:nth-child(4) { left: 69%; top: 50%; width: 15%; }
.cat-art span:nth-child(5) { left: 84%; top: 8%; width: 12%; }
.cat-art span:nth-child(n+6) { display: none; }
.cat-gala.cat-art span { background: var(--wp--preset--color--ink-700); opacity: 0.85; }
.cat-art .icon { width: 46%; height: 46%; }
.hero-banner__media .cat-art { --r: var(--wp--custom--radius--xl); }
.card .cat-art { --r: var(--wp--custom--radius--md); }

/* Home: rights, numbers, campaign, volunteer band  >> patterns cry/rights, cry/campaign-feature, cry/volunteer-band */
.rights { display: grid; gap: var(--wp--preset--spacing--20); grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.right-card { display: grid; align-content: start; gap: var(--wp--preset--spacing--10); padding: var(--wp--preset--spacing--30); border-radius: var(--wp--custom--radius--lg); background: var(--wp--preset--color--surface); box-shadow: var(--wp--preset--shadow--sm); border-top: 4px solid var(--wp--preset--color--brand-yellow); }
.right-card h3 { margin: 0; }
.right-card p { margin: 0; color: var(--wp--preset--color--main-accent); }
.right-card__links { list-style: none; padding: 0; margin: var(--wp--preset--spacing--10) 0 0; display: flex; flex-wrap: wrap; gap: 6px var(--wp--preset--spacing--20); font-size: var(--wp--preset--font-size--small); font-weight: var(--wp--custom--font-weight--bold); }
.national-pair { display: grid; gap: var(--wp--preset--spacing--30); grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
.gala-list { list-style: none; padding: 0; margin: var(--wp--preset--spacing--30) 0 0; display: grid; gap: var(--wp--preset--spacing--10); grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.gala-list a { display: flex; align-items: center; gap: var(--wp--preset--spacing--10); padding: var(--wp--preset--spacing--20); border-radius: var(--wp--custom--radius--md); border: 1px solid var(--wp--preset--color--border-light); color: var(--wp--preset--color--main); text-decoration: none; }
.gala-list a:hover { border-color: var(--wp--preset--color--link); color: var(--wp--preset--color--main); }
.gala-list b { flex: 1; }
.gala-list span { color: var(--wp--preset--color--main-accent); font-size: var(--wp--preset--font-size--small); }
.vol-band { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--wp--preset--spacing--50); align-items: center; }
.vol-band .media { --r: var(--wp--custom--radius--xl); }
@media (max-width: 860px) { .vol-band { grid-template-columns: 1fr; } }
.ticks { list-style: none; padding: 0; margin: 0; display: grid; gap: var(--wp--preset--spacing--10); }
.ticks li { display: flex; gap: var(--wp--preset--spacing--10); align-items: baseline; }
.ticks li > .icon { align-self: center; }
.ticks .icon { color: var(--wp--preset--color--accent-text); }
.stories { display: grid; gap: var(--wp--preset--spacing--30); grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); align-items: start; }
.cat-topic.cat-art { background: var(--wp--preset--gradient--warm-wash); color: var(--wp--preset--color--plum-700); }

/* Search  >> pattern cry/search */
.search-bar { display: flex; gap: var(--wp--preset--spacing--10); max-width: var(--wp--style--global--content-size); }
.search-bar .input-affix { flex: 1; }
.results { margin-top: var(--wp--preset--spacing--40); }
.results h2 { font-size: var(--wp--preset--font-size--large); }
.results ul { list-style: none; padding: 0; margin: 0 0 var(--wp--preset--spacing--10); display: grid; gap: 4px; }
.result { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--wp--preset--spacing--20); align-items: center; padding: var(--wp--preset--spacing--20); border-radius: var(--wp--custom--radius--md); color: var(--wp--preset--color--main); text-decoration: none; border: 1px solid var(--wp--preset--color--border-light); background: var(--wp--preset--color--surface); }
.result:hover { border-color: var(--wp--preset--color--border-dark); color: var(--wp--preset--color--main); }
.result b { display: block; }
.result small { display: block; color: var(--wp--preset--color--main-accent); }
.result__ico { width: 2.5rem; height: 2.5rem; display: grid; place-items: center; border-radius: var(--wp--custom--radius--sm); background: var(--wp--preset--color--selected); color: var(--wp--preset--color--main); }
a.chip { text-decoration: none; }
a.chip[aria-pressed="true"] { background: var(--wp--preset--color--selected); border-color: var(--wp--preset--color--main); box-shadow: inset 0 0 0 1px var(--wp--preset--color--main); color: var(--wp--preset--color--main); }
a.chip[class*="cat-"]:hover { background: var(--cat-tint); color: var(--wp--preset--color--ink); }

/* ---------- Access message, empty states, placeholders ---------- */
.notice-page { max-width: 36rem; margin: var(--wp--preset--spacing--70) auto; text-align: center; display: grid; justify-items: center; gap: var(--wp--preset--spacing--20); }
.notice-page__ico { width: 5rem; height: 5rem; border-radius: 50%; display: grid; place-items: center; background: var(--wp--preset--color--yellow-50); color: var(--wp--preset--color--ink); }
.notice-page__ico .icon { width: 2.25rem; height: 2.25rem; }

/* =====================================================================
   Design System page (#/design-system) · documentation chrome
   ===================================================================== */
.ds-nav { display: grid; gap: 2px; font-size: var(--wp--preset--font-size--small); }
.ds-nav a { display: block; padding: 6px var(--wp--preset--spacing--20); border-radius: var(--wp--custom--radius--sm); color: var(--wp--preset--color--main-accent); text-decoration: none; }
.ds-nav a:hover { background: var(--wp--preset--color--base-alt); color: var(--wp--preset--color--main); }
@media (max-width: 960px) { .ds-nav { display: flex; overflow-x: auto; gap: 4px; padding-bottom: 4px; scrollbar-width: thin; } .ds-nav a { white-space: nowrap; background: var(--wp--preset--color--base-alt); border-radius: var(--wp--custom--radius--pill); } }
.ds-nav a.is-active { background: var(--wp--preset--color--selected); color: var(--wp--preset--color--main); font-weight: var(--wp--custom--font-weight--bold); }
.ds-sec { padding-block: var(--wp--preset--spacing--50); border-top: 1px solid var(--wp--preset--color--border-light); scroll-margin-top: calc(var(--wp--custom--header-height) + var(--wp--preset--spacing--20)); }
.ds-sec:first-child { border-top: 0; padding-top: 0; }
.ds-sec > h2 { margin-bottom: var(--wp--preset--spacing--10); }
.ds-sec > .lead { margin-bottom: var(--wp--preset--spacing--40); }
.ds-sub { margin: var(--wp--preset--spacing--40) 0 var(--wp--preset--spacing--20); font-size: var(--wp--preset--font-size--medium); }
.ds-label { display: block; margin-bottom: var(--wp--preset--spacing--10); font-size: var(--wp--preset--font-size--small); font-weight: var(--wp--custom--font-weight--bold); color: var(--wp--preset--color--main-accent); }
.ds-label code { font-weight: var(--wp--custom--font-weight--regular); }
.ds-specimen { padding: var(--wp--preset--spacing--30); border-radius: var(--wp--custom--radius--lg); border: 1px solid var(--wp--preset--color--border-light); background: var(--wp--preset--color--base); }
.ds-specimen--alt { background: var(--wp--preset--color--base-alt); }
.ds-specimen--dark { background: var(--wp--preset--color--ink); }
.ds-specimen--dark .ds-label { color: var(--wp--preset--color--gray-300); }
.ds-specimen + .ds-specimen { margin-top: var(--wp--preset--spacing--20); }
.ds-swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--wp--preset--spacing--20); }
.swatch { border-radius: var(--wp--custom--radius--md); overflow: hidden; border: 1px solid var(--wp--preset--color--border-light); background: var(--wp--preset--color--surface); font-size: var(--wp--preset--font-size--small); }
.swatch__chip { aspect-ratio: 2 / 1; background: var(--c); border-bottom: 1px solid var(--wp--preset--color--border-light); }
.swatch__meta { padding: var(--wp--preset--spacing--10); line-height: var(--wp--custom--line-height--snug); }
.swatch__meta b { display: block; }
.swatch__meta code { display: block; color: var(--wp--preset--color--main-accent); word-break: break-all; }
.ds-scale li { display: grid; grid-template-columns: 7rem minmax(0, 1fr); gap: var(--wp--preset--spacing--20); align-items: baseline; padding: var(--wp--preset--spacing--10) 0; border-bottom: 1px solid var(--wp--preset--color--border-light); }
.ds-scale { list-style: none; padding: 0; margin: 0; }
.ds-scale code { color: var(--wp--preset--color--main-accent); }
.ds-scale__sample { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ds-space { display: grid; gap: var(--wp--preset--spacing--10); }
.ds-space div { display: grid; grid-template-columns: 7rem minmax(0, 1fr) 9rem; gap: var(--wp--preset--spacing--20); align-items: center; font-size: var(--wp--preset--font-size--small); }
.ds-space i { display: block; height: 1rem; width: var(--s); background: var(--wp--preset--color--teal); border-radius: 3px; }
.ds-radius { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: var(--wp--preset--spacing--20); }
.ds-radius div { aspect-ratio: 1; display: grid; place-items: center; text-align: center; background: var(--wp--preset--color--yellow-50); color: var(--wp--preset--color--ink); border: 1.5px solid var(--wp--preset--color--yellow-700); font-size: var(--wp--preset--font-size--small); }
.ds-elev { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: var(--wp--preset--spacing--30); }
.ds-elev div { aspect-ratio: 3 / 2; display: grid; place-items: center; border-radius: var(--wp--custom--radius--lg); background: var(--wp--preset--color--surface); font-size: var(--wp--preset--font-size--small); }
.ds-row { display: flex; flex-wrap: wrap; gap: var(--wp--preset--spacing--20); align-items: center; }
.ds-grid-2 { display: grid; gap: var(--wp--preset--spacing--30); grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); align-items: start; }
.ds-grid-3 { display: grid; gap: var(--wp--preset--spacing--30); grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); align-items: start; }
.ds-pre { max-height: 32rem; overflow: auto; padding: var(--wp--preset--spacing--20); border-radius: var(--wp--custom--radius--md); background: var(--wp--preset--color--ink); color: var(--wp--preset--color--gray-50); white-space: pre; }
.ds-pre:focus-visible { outline-color: var(--wp--preset--color--brand-yellow); }
.dodont { display: grid; gap: var(--wp--preset--spacing--20); grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.dodont figure { margin: 0; border-radius: var(--wp--custom--radius--lg); border: 1px solid var(--wp--preset--color--border-light); overflow: hidden; background: var(--wp--preset--color--surface); }
.dodont__demo { padding: var(--wp--preset--spacing--30); min-height: 8rem; display: grid; place-items: center; background: var(--wp--preset--color--base-alt); }
.dodont figcaption { padding: var(--wp--preset--spacing--20); font-size: var(--wp--preset--font-size--small); border-top: 4px solid; }
.dodont .do figcaption { border-color: var(--wp--preset--color--success); }
.dodont .dont figcaption { border-color: var(--wp--preset--color--error); }
.dodont figcaption b { display: inline-flex; align-items: center; gap: 4px; }
.dodont .do figcaption b { color: var(--wp--preset--color--success-text); }
.dodont .dont figcaption b { color: var(--wp--preset--color--error-text); }
.ratio { font-variant-numeric: tabular-nums; font-weight: var(--wp--custom--font-weight--bold); }
.pair-chip--ui { min-width: 3rem; height: 1.75rem; border-width: 3px; border-style: solid; }
.pair-chip { display: inline-grid; place-items: center; min-width: 4.5rem; padding: 4px var(--wp--preset--spacing--10); border-radius: var(--wp--custom--radius--xs); border: 1px solid var(--wp--preset--color--border-light); font-weight: var(--wp--custom--font-weight--bold); }
.ds-anatomy { font-size: var(--wp--preset--font-size--small); color: var(--wp--preset--color--main-accent); margin-top: var(--wp--preset--spacing--10); }
.ds-anatomy code { color: var(--wp--preset--color--main); }
.ds-demo-header { border: 1px solid var(--wp--preset--color--border-light); border-radius: var(--wp--custom--radius--lg); overflow: hidden; }
.ds-demo-header .site-header { position: relative; }

/* =====================================================================
   Stage 3 · content page patterns
   ===================================================================== */
.media--round { --r: var(--wp--custom--radius--xl); }
/* Link list (sidebar)  >> pattern cry/link-list */
.link-list { display: grid; gap: var(--wp--preset--spacing--10); }
.link-list a, .link-tile { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--wp--preset--spacing--20); align-items: center; padding: var(--wp--preset--spacing--20); border-radius: var(--wp--custom--radius--md); border: 1px solid var(--wp--preset--color--border-light); background: var(--wp--preset--color--surface); color: var(--wp--preset--color--main); text-decoration: none; }
.link-list a:hover, .link-tile:hover { border-color: var(--wp--preset--color--border-dark); color: var(--wp--preset--color--main); }
.link-list small, .link-tile small { display: block; color: var(--wp--preset--color--main-accent); }
.link-tile { padding: var(--wp--preset--spacing--30); border-radius: var(--wp--custom--radius--lg); box-shadow: var(--wp--preset--shadow--sm); }
.link-tile .stat__ico { margin: 0; }
/* Timeline  >> pattern cry/timeline */
.timeline { list-style: none; padding: 0; margin: 0; border-left: 3px solid var(--wp--preset--color--brand-yellow); }
.timeline li { position: relative; padding: 0 0 var(--wp--preset--spacing--30) var(--wp--preset--spacing--30); }
.timeline li::before { content: ""; position: absolute; left: -9px; top: 4px; width: 15px; height: 15px; border-radius: 50%; background: var(--wp--preset--color--surface); border: 3px solid var(--wp--preset--color--main); }
.timeline b { font-family: var(--wp--preset--font-family--heading); font-size: var(--wp--preset--font-size--large); }
.timeline p { margin: 4px 0 0; color: var(--wp--preset--color--main-accent); }
/* Numbered steps  >> pattern cry/theory-of-change */
.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: var(--wp--preset--spacing--20); grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.steps li { display: grid; gap: 6px; align-content: start; padding: var(--wp--preset--spacing--30); border-radius: var(--wp--custom--radius--lg); background: var(--wp--preset--color--surface); box-shadow: var(--wp--preset--shadow--sm); }
.steps__n { width: 2.25rem; height: 2.25rem; display: grid; place-items: center; border-radius: 50%; background: var(--wp--preset--color--primary); color: var(--wp--preset--color--on-primary); font-family: var(--wp--preset--font-family--heading); font-weight: var(--wp--custom--font-weight--bold); }
.steps b { font-family: var(--wp--preset--font-family--heading); font-size: var(--wp--preset--font-size--large); }
.steps p { margin: 0; color: var(--wp--preset--color--main-accent); }
.fund-steps { list-style: none; padding: 0; margin: 0; display: grid; gap: var(--wp--preset--spacing--30); grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.fund-steps li { display: grid; gap: var(--wp--preset--spacing--10); align-content: start; padding: var(--wp--preset--spacing--40); border-radius: var(--wp--custom--radius--xl); background: var(--wp--preset--color--surface); box-shadow: var(--wp--preset--shadow--md); }
.fund-steps h2 { font-size: var(--wp--preset--font-size--large); margin: 0; }
.fund-steps p { margin: 0; color: var(--wp--preset--color--main-accent); }
/* Document list  >> pattern cry/document-list */
.doc-list { list-style: none; padding: 0; margin: 0; display: grid; gap: var(--wp--preset--spacing--10); }
.doc-list li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--wp--preset--spacing--20); align-items: center; padding: var(--wp--preset--spacing--20); border-radius: var(--wp--custom--radius--md); border: 1px solid var(--wp--preset--color--border-light); background: var(--wp--preset--color--surface); }
.doc-list small { display: block; color: var(--wp--preset--color--main-accent); }
.doc-list__ico { width: 2.5rem; height: 2.5rem; display: grid; place-items: center; border-radius: var(--wp--custom--radius--sm); background: var(--wp--preset--color--selected); }
.captcha { display: flex; gap: var(--wp--preset--spacing--10); align-items: center; padding: var(--wp--preset--spacing--20); margin-bottom: var(--wp--preset--spacing--20); border: 1px dashed var(--wp--preset--color--border-dark); border-radius: var(--wp--custom--radius--md); color: var(--wp--preset--color--main-accent); font-size: var(--wp--preset--font-size--small); }
/* Prose (legal, articles) */
.prose h2 { margin-top: var(--wp--preset--spacing--50); scroll-margin-top: calc(var(--wp--custom--header-height) + var(--wp--preset--spacing--20)); }
.prose blockquote { margin: var(--wp--preset--spacing--40) 0; padding-left: var(--wp--preset--spacing--30); border-left: 4px solid var(--wp--preset--color--brand-yellow); font-family: var(--wp--preset--font-family--heading); font-size: var(--wp--preset--font-size--large); }
.toc { padding: var(--wp--preset--spacing--20) var(--wp--preset--spacing--30); border-radius: var(--wp--custom--radius--lg); background: var(--wp--preset--color--base-alt); font-size: var(--wp--preset--font-size--small); }
.toc ol { margin: var(--wp--preset--spacing--10) 0 0; }
.share { display: flex; flex-wrap: wrap; gap: var(--wp--preset--spacing--10); margin-top: var(--wp--preset--spacing--40); padding-top: var(--wp--preset--spacing--30); border-top: 1px solid var(--wp--preset--color--border-light); }
/* Email preferences */
.pref-row { display: flex; justify-content: space-between; align-items: center; gap: var(--wp--preset--spacing--20); padding: var(--wp--preset--spacing--20) 0; border-bottom: 1px solid var(--wp--preset--color--border-light); cursor: pointer; }
.pref-row small { display: block; color: var(--wp--preset--color--main-accent); }
/* Focus cards */
.focus-card .stat__ico { margin-bottom: 0; }
/* Bar chart: single series, one hue, value labels, table view  >> custom block cry/bar-chart */
.chart { margin: 0; padding: var(--wp--preset--spacing--30); border-radius: var(--wp--custom--radius--xl); background: var(--wp--preset--color--surface); box-shadow: var(--wp--preset--shadow--md); }
.chart__title { font-family: var(--wp--preset--font-family--heading); font-size: var(--wp--preset--font-size--medium); font-weight: var(--wp--custom--font-weight--semibold); margin-bottom: var(--wp--preset--spacing--20); }
.bars { list-style: none; padding: 0; margin: 0; display: grid; gap: var(--wp--preset--spacing--10); }
.bars li { display: grid; grid-template-columns: minmax(7rem, 11rem) minmax(0, 1fr) auto; gap: var(--wp--preset--spacing--20); align-items: center; padding: 4px; border-radius: var(--wp--custom--radius--xs); font-size: var(--wp--preset--font-size--small); }
.bars li:hover { background: var(--wp--preset--color--base-alt); }
.bars__label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bars__track { height: 0.875rem; }
.bars__bar { display: block; height: 100%; width: var(--w); min-width: 2px; background: var(--wp--preset--color--teal-700); border-radius: 0 4px 4px 0; }
:is([data-variation="dark"], .is-style-section-dark) .bars__bar { background: var(--wp--preset--color--teal); }
.bars__val { font-variant-numeric: tabular-nums; }
@media (max-width: 480px) { .bars li { grid-template-columns: 1fr auto; } .bars__track { grid-column: 1 / -1; grid-row: 2; } }
/* Filters + explainer  >> pattern cry/filters */
.explainer { display: flex; gap: var(--wp--preset--spacing--20); padding: var(--wp--preset--spacing--20) var(--wp--preset--spacing--30); border-radius: var(--wp--custom--radius--lg); background: var(--wp--preset--color--yellow-50); color: var(--wp--preset--color--ink); margin-bottom: var(--wp--preset--spacing--30); }
.explainer p { margin: 0; }
.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 0 var(--wp--preset--spacing--20); align-items: end; padding: var(--wp--preset--spacing--20) var(--wp--preset--spacing--30) 0; border-radius: var(--wp--custom--radius--lg); background: var(--wp--preset--color--base-alt); margin-bottom: var(--wp--preset--spacing--20); }
.filters .btn--tertiary { margin-bottom: var(--wp--preset--spacing--20); justify-self: start; }
/* Gift summary, payment */

.mini-list li:last-child { border-bottom: 0; }
.mini-list a:has(.badge) { display: grid; grid-template-columns: auto 1fr; gap: var(--wp--preset--spacing--10); align-items: center; color: var(--wp--preset--color--main); text-decoration: none; }
.mini-list small { display: block; color: var(--wp--preset--color--main-accent); }
.acc-panel { border: 1px solid var(--wp--preset--color--border-light); border-radius: var(--wp--custom--radius--md); padding: 0 var(--wp--preset--spacing--20); }
.acc-panel summary { padding: var(--wp--preset--spacing--20) 0; cursor: pointer; font-weight: var(--wp--custom--font-weight--bold); }
.acc-panel[open] { padding-bottom: var(--wp--preset--spacing--20); }
.qr-tickets--sm { margin: 0; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); }
.qr-tickets--sm .qr-ticket { grid-template-columns: 4.5rem 1fr; }
.qr-tickets--sm .btn--tertiary { justify-content: flex-start; color: var(--wp--preset--color--ink); }
.auth { max-width: 28rem; margin-inline: auto; }
.auth .seg { margin-top: var(--wp--preset--spacing--10); }
.auth__or { display: flex; align-items: center; gap: var(--wp--preset--spacing--20); color: var(--wp--preset--color--main-accent); font-size: var(--wp--preset--font-size--small); }
.auth__or::before, .auth__or::after { content: ""; flex: 1; height: 1px; background: var(--wp--preset--color--border-light); }
.danger-zone { border: 1.5px solid var(--wp--preset--color--error-text); box-shadow: none; }

/* =====================================================================
   Stage 8 · Organizer and Super Admin
   ===================================================================== */
.manage-tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; margin-bottom: var(--wp--preset--spacing--30); border-radius: var(--wp--custom--radius--lg); background: var(--wp--preset--color--base-alt); }
.manage-tabs a { padding: var(--wp--preset--spacing--10) var(--wp--preset--spacing--20); border-radius: var(--wp--custom--radius--md); color: var(--wp--preset--color--main-accent); text-decoration: none; font-size: var(--wp--preset--font-size--small); font-weight: var(--wp--custom--font-weight--bold); }
.manage-tabs a:hover { color: var(--wp--preset--color--main); }
.manage-tabs a[aria-current] { background: var(--wp--preset--color--surface); color: var(--wp--preset--color--main); box-shadow: var(--wp--preset--shadow--sm); }
.manage-tabs a:last-child { margin-left: auto; }
.task-list { list-style: none; padding: 0; margin: 0; display: grid; gap: var(--wp--preset--spacing--10); }
.task-list li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--wp--preset--spacing--20); align-items: center; padding: var(--wp--preset--spacing--20); border-radius: var(--wp--custom--radius--md); border: 1px solid var(--wp--preset--color--border-light); background: var(--wp--preset--color--surface); }
.task-list small { display: block; color: var(--wp--preset--color--main-accent); }
@media (max-width: 560px) { .task-list li { grid-template-columns: 1fr; } }
.rows { display: grid; gap: var(--wp--preset--spacing--10); }
.rows__row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 120px), 1fr)) auto; gap: 0 var(--wp--preset--spacing--10); align-items: end; padding: var(--wp--preset--spacing--10) var(--wp--preset--spacing--20) 0; border-radius: var(--wp--custom--radius--md); background: var(--wp--preset--color--base-alt); }
.rows__row .btn--icon { margin-bottom: var(--wp--preset--spacing--20); }
.rows > .btn--tertiary { justify-self: start; }
.approval-list { list-style: none; padding: 0; margin: 0; display: grid; gap: var(--wp--preset--spacing--20); }
.approval h2 { font-size: var(--wp--preset--font-size--large); }
.approval p { margin: var(--wp--preset--spacing--10) 0; }
.count { display: inline-grid; place-items: center; min-width: 1.5rem; height: 1.5rem; padding: 0 6px; border-radius: var(--wp--custom--radius--pill); background: var(--wp--preset--color--primary); color: var(--wp--preset--color--on-primary); font-weight: var(--wp--custom--font-weight--bold); }

  const MSG = ['So proud of you!', '', 'For every child who deserves a chance.', '', 'Go team!', 'Happy to support.', '', 'Keep going!', 'In honor of my grandmother.', '', 'Every child deserves school.', '', 'Love this cause.', ''];
  const AMT = [25, 50, 51, 75, 100, 101, 100, 150, 200, 250, 50, 500, 25, 100];
  const rnd = (seed) => () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  return function gifts(seed, count, endIso) {
    const r = rnd(seed); const end = new Date(endIso + 'T12:00:00'); const out = [];
    for (let i = 0; i < count; i++) {
      const anon = r() < 0.15;
      const d = new Date(end); d.setDate(d.getDate() - Math.floor(r() * 45));

  faqs: [
    { topic: 'Donating & tax receipts', q: 'Is my donation tax-deductible?', a: 'Yes. CRY America is a 501(c)(3) tax-exempt organization, so gifts are tax-deductible to the extent allowed by law. You get an emailed receipt right away, and you can download every receipt from My Account.' },
    { topic: 'Donating & tax receipts', q: 'Can I change, pause or cancel my monthly gift?', a: 'Yes, at any time. Go to My Account → Recurring gifts to change the amount or date, pause, or cancel.' },
    { topic: 'Donating & tax receipts', q: 'Can I give stock, through a donor-advised fund or by bank transfer?', a: 'Yes. See Ways to Give for stock transfers, DAF grants, ACH and wire transfers, checks and matching gifts.' },
    { topic: 'Donating & tax receipts', q: 'Will my employer match my gift?', a: 'Many employers do. Search for your company on the donation form or on Ways to Give, and we will tell you how to request the match.' },
    { topic: 'Events & registration', q: 'What part of a gala ticket is tax-deductible?', a: 'The fair value of dinner and entertainment is not deductible. Your receipt shows the non-deductible portion for each seat or table; the rest is a deductible donation.' },
    { topic: 'Events & registration', q: 'Can I transfer or cancel my registration?', a: 'You can edit attendee details and transfer tickets from My Account → Registrations. Refunds follow each event’s policy, shown at checkout.' },
    { topic: 'Events & registration', q: 'Do events happen only at certain times of year?', a: 'No. CRY events run all year: walks, galas, Holi and Dandiya festivals, sports tournaments and more.' },
    { topic: 'Fundraising', q: 'What is My Occasions?', a: 'My Occasions lets you turn a birthday, anniversary, arangetram, memorial or festival into a fundraiser. Friends give to your page instead of gifts. My Occasions pages are always individual.' },
    { topic: 'Fundraising', q: 'How do teams work?', a: 'Teams are part of event fundraising. When you register for an event you can start a page and create or join a team for that event. You can be on one team per event.' },
    { topic: 'Volunteering', q: 'How do I volunteer?', a: 'Volunteering happens through your local Action Center. Find your city on the Action Centers page, or sign up for open shifts at upcoming events.' },
    { topic: 'Volunteering', q: 'Can students and young people volunteer?', a: 'Yes. Youth volunteers are welcome with a parent’s consent, and several cities have youth groups.' },
    { topic: 'Account', q: 'Do I need an account to donate?', a: 'No. An account is optional for donating, and it lets you see receipts, manage monthly gifts, registrations and fundraising pages in one place.' },
  ],

/* Image from the asset registry; every image gets a fallback placeholder of the same ratio. */
function img(key, opts) {
  const o = opts || {};
  const a = DATA.assets[key];
  const ar = o.ar || (a && a.ar) || '4/3';
  if (!a) return `<figure class="media media--fallback ${o.cls || ''}" style="--ar:${ar}" data-alt="${esc(o.alt || 'Image to come')}"></figure>`;
  const style = [`--ar:${ar}`, a.pos || o.pos ? `--pos:${o.pos || a.pos}` : '', a.zoom || o.zoom ? `--zoom:${o.zoom || a.zoom}` : ''].filter(Boolean).join(';');
  return `<figure class="media ${o.cls || ''}" style="${style}"><img src="${esc(a.url)}" alt="${esc(o.alt != null ? o.alt : a.alt)}" loading="${o.eager ? 'eager' : 'lazy'}" decoding="async" onerror="imgFail(this)"></figure>`;
}
function placeholder(label, ar) {
  return `<div class="placeholder" style="--ar:${ar || '4/3'}" role="img" aria-label="${esc(label)}"><span>${esc(label)}</span></div>`;
}
function avatar(name, opts) {
  const o = opts || {};
  const v = (hashCode(name) % 4) + 1;
  const inner = o.img && DATA.assets[o.img] ? `<img src="${esc(DATA.assets[o.img].url)}" alt="" onerror="this.remove()">` : '';
  return `<span class="avatar av-${v} ${o.size ? 'avatar--' + o.size : ''}" ${o.label === false ? 'aria-hidden="true"' : `role="img" aria-label="${esc(name)}"`}>${inner || esc(initials(name))}</span>`;
}

/* ---------- 2. ROLLUP: the only place money is added up ---------- */
const ROLLUP = {
  sum: (list) => (list || []).reduce((a, d) => a + d.amount, 0),
  fundraiser(f) { return ROLLUP.sum(f.donations); },
  fundraisersFor(pred) { return DATA.fundraisers.filter(pred); },
  team(t) { return ROLLUP.sum(t.donations) + ROLLUP.fundraisersFor((f) => f.team === t.slug).reduce((a, f) => a + ROLLUP.fundraiser(f), 0); },
  teamDonations(t) { return [...(t.donations || []), ...ROLLUP.fundraisersFor((f) => f.team === t.slug).flatMap((f) => f.donations)]; },
  eventDonations(e) {
    const direct = DATA.eventDonations[e.slug] || [];
    const teamDirect = DATA.teams.filter((t) => t.event === e.slug).flatMap((t) => t.donations || []);
    const pages = ROLLUP.fundraisersFor((f) => f.event === e.slug).flatMap((f) => f.donations);
    return [...direct, ...teamDirect, ...pages];
  },
  event(e) { return ROLLUP.sum(ROLLUP.eventDonations(e)); },
  national(cat, year) {
    const evs = DATA.events.filter((e) => e.cat === cat && e.date.startsWith(String(year)));
    return { events: evs, raised: evs.reduce((a, e) => a + ROLLUP.event(e), 0), goal: evs.reduce((a, e) => a + (e.goal || 0), 0) };
  },
  project(p) { return ROLLUP.sum(p.donations); },
};

  const attrs = o.attrs || '';
  if (o.href) return `<a class="${cls}" href="${o.href}" ${attrs}>${inner}</a>`;
  return `<button class="${cls}" type="${o.type || 'button'}" ${o.disabled ? 'disabled' : ''} ${attrs}>${inner}</button>`;
}

/* Goal meter: bar only when a goal exists; otherwise raised + donors, no placeholder text. */
function meter(o) {
  const hasGoal = !!o.goal;
  const p = hasGoal ? pct(o.raised, o.goal) : 0;
  const label = o.label || 'Fundraising progress';
  return `${pat('cry/goal-meter')}<div class="meter ${o.size === 'sm' ? 'meter--sm' : ''} ${hasGoal ? '' : 'meter--nogoal'}">
    <div class="meter__nums"><span class="meter__raised">${money(o.raised)}</span><span class="meter__goal">${hasGoal ? `raised of ${money(o.goal)} goal` : 'raised'}</span></div>
    ${hasGoal ? `<div class="meter__bar ${p >= 100 ? 'is-over' : ''}" role="progressbar" aria-label="${esc(label)}" aria-valuemin="0" aria-valuemax="${o.goal}" aria-valuenow="${o.raised}" aria-valuetext="${money(o.raised)} of ${money(o.goal)}, ${p}%" style="--pct:${Math.min(p, 100)}%"><span></span></div>` : ''}
    <div class="meter__foot"><span><b>${o.donors}</b> ${o.donors === 1 ? 'donor' : 'donors'}</span>${hasGoal ? `<span><b>${p}%</b> of goal</span>` : ''}${o.extra ? `<span>${o.extra}</span>` : ''}</div>
  </div>`;
}
function meterNational(cat, year) {
  const n = ROLLUP.national(cat, year);
  const c = catOf(cat);
  const goal = n.goal;
  const segs = n.events.map((e, i) => ({ e, raised: ROLLUP.event(e), i: (i % 6) + 1 }));
  return `${pat('cry/goal-meter-national')}<div class="meter meter--national">
    <h3 class="eyebrow">${icon(c.icon, 'icon--sm')} ${esc(c.plural)} ${year} · all cities</h3>

    <div class="meter__bar" role="img" aria-label="${money(n.raised)} raised of ${money(goal)} across ${segs.length} city events">${segs.map((s) => `<span class="seg-${s.i}" style="--w:${goal ? (s.raised / goal) * 100 : 0}%"></span>`).join('')}</div>
    <ul class="legend">${segs.map((s) => `<li><i class="seg-${s.i}"></i>${esc(s.e.ac ? acOf(s.e.ac).name : s.e.city)}<b>${money(s.raised)}</b></li>`).join('')}</ul>

function field(o) {
  const id = o.id || uid('f');

  const ok = o.ok ? `<p class="field__ok">${icon('check-circle', 'icon--sm')}${esc(o.ok)}</p>` : '';
  const desc = [o.hint ? id + '-h' : '', id + '-e'].filter(Boolean).join(' ');
  const common = `id="${id}" name="${o.name || id}" aria-describedby="${desc}" ${o.required ? 'required aria-required="true"' : ''} ${o.error ? 'aria-invalid="true"' : ''} ${o.disabled ? 'disabled' : ''} ${o.attrs || ''}`;
  let control;
  if (o.type === 'select') control = `<select class="select" ${common}>${(o.options || []).map((op) => `<option ${op === o.value ? 'selected' : ''}>${esc(op)}</option>`).join('')}</select>`;
  else if (o.type === 'textarea') control = `<textarea class="textarea" ${common} placeholder="${esc(o.placeholder || '')}">${esc(o.value || '')}</textarea>`;

}

/* Designation: general fund, an event, a fundraising page or a campaign. Pre-selected from the page context.
   Dedicated project funding is only for gifts of PROJECT_MIN or more, so projects never appear in the regular list. */
const PROJECT_MIN = 2500;
const PROJECT_AMOUNTS = [2500, 5000, 10000, 25000];
function designationLabel(v) {
  const [k, s] = (v || 'general').split(':');
  if (k === 'project') return projectOf(s) && projectOf(s).name;
  if (k === 'event') return eventOf(s) && eventOf(s).title;
  if (k === 'page') return fundOf(s) && fundOf(s).title;
  if (k === 'team') return teamOf(s) && 'Team ' + teamOf(s).name;
  if (k === 'campaign') { const c = DATA.campaigns.find((x) => x.slug === s); return c && 'Campaign: ' + c.title; }
  return 'General fund (greatest need)';
}
/* The list is scoped to the page: on an Action Center page or one of its events, only that Action Center's
   events (its campaigns) are offered; elsewhere, the organization-wide campaigns. Always with the General Fund. */
function designationField(id, value, acSlug) {
  const v = value || 'general';
  const ac = acSlug === undefined ? STATE.giveAC : acSlug;
  const opt = (val, label) => `<option value="${val}" ${val === v ? 'selected' : ''}>${esc(label)}</option>`;
  const evs = ac ? upcoming().filter((e) => e.ac === ac) : [];
  if (/^event:/.test(v) && !evs.some((e) => 'event:' + e.slug === v)) evs.unshift(eventOf(v.slice(6)));
  const camps = DATA.campaigns.filter((c) => c.landing !== false && !(v === 'campaign:' + c.slug));
  const extra = /^(page|team|campaign):/.test(v) ? `<optgroup label="This page">${opt(v, designationLabel(v))}</optgroup>` : '';
  return `<div class="field"><label class="field__label" for="${id}-des">Designation</label>${v !== 'general' || ac ? `<p class="field__hint" id="${id}-des-h">${ac ? `Showing ${esc(acOf(ac).name)} Action Center campaigns.` : 'Pre-selected from the page you were on.'} You can change it.</p>` : ''}
    <select class="select" id="${id}-des" name="${id}-des" ${v !== 'general' || ac ? `aria-describedby="${id}-des-h"` : ''}>${opt('general', 'General fund (greatest need)')}${extra}
      ${/^project:/.test(v) ? `<optgroup label="Dedicated project funding ($2,500+)">${opt(v, designationLabel(v))}</optgroup>` : ''}
      ${evs.length ? `<optgroup label="${ac ? esc(acOf(ac).name) + ' Action Center campaigns' : 'This event'}">${evs.map((e) => opt('event:' + e.slug, e.title)).join('')}</optgroup>` : ''}
      ${!ac && camps.length ? `<optgroup label="CRY America campaigns">${camps.map((c) => opt('campaign:' + c.slug, c.title)).join('')}</optgroup>` : ''}
    </select></div>`;
}

function searchIndex() {
  const idx = [];
  DATA.events.forEach((e) => idx.push({ type: 'events', title: e.title, sub: `${fmtDate(e.date)} · ${e.venue}, ${e.city}${isPast(e.date) ? ' · Completed' : ''}`, href: hrefEvent(e), text: [e.title, e.city, e.venue, catOf(e.cat).name, e.ac || ''].join(' ') }));
  DATA.fundraisers.forEach((f) => idx.push({ type: 'fundraisers', title: f.title, sub: `${f.owner} · ${f.type === 'occasion' ? 'My Occasion · ' + f.occasion : eventOf(f.event).title} · ${money(ROLLUP.fundraiser(f))} raised`, href: hrefFund(f), text: [f.title, f.owner, f.occasion || '', f.event || '', f.team ? teamOf(f.team).name : ''].join(' ') }));
  DATA.teams.forEach((t) => idx.push({ type: 'fundraisers', title: 'Team ' + t.name, sub: `${eventOf(t.event).title} · captain ${t.captain} · ${money(ROLLUP.team(t))} raised`, href: hrefTeam(t), text: [t.name, t.captain, t.type, t.event].join(' ') }));
  DATA.projects.forEach((p) => idx.push({ type: 'projects', title: p.name, sub: [p.partner, focusOf(p.focus).name, p.story].filter(Boolean).join(' · '), href: '#/projects/' + p.slug, text: [p.name, p.partner || '', focusOf(p.focus).name, p.story || ''].join(' ') }));
  DATA.articles.forEach((a) => idx.push({ type: 'articles', title: a.title, sub: `${a.topic} · ${fmtDate(a.date, { month: 'long', day: 'numeric', year: 'numeric' })}`, href: '#/news/' + a.slug, text: [a.title, a.topic, a.excerpt].join(' ') }));
  activeACs().forEach((a) => idx.push({ type: 'centers', title: `${a.name} Action Center`, sub: `${a.state} · volunteer-led`, href: '#/action-centers/' + a.slug, text: a.name + ' ' + a.state + ' volunteer' }));
  SITEMAP.filter((r) => r.route && !r.route.includes(':') && /^Public/.test(r.access)).forEach((r) => idx.push({ type: 'pages', title: r.title, sub: r.section, href: '#' + r.route, text: [r.title, r.section, r.purpose || ''].join(' ') }));
  return idx;
}
function pageSearch() {

  const shown = type ? all.filter((r) => r.type === type) : all;
  const count = (t) => all.filter((r) => r.type === t).length;
  const qs = (t) => `#/search?q=${encodeURIComponent(q)}${t ? '&type=' + t : ''}`;
  const groups = SEARCH_TYPES.filter(([t]) => shown.some((r) => r.type === t));

function dsSwatches() {
  const P = JSON.parse(document.getElementById('theme-json').textContent).settings.color.palette;
  const groups = [
    ['Semantic (switch in dark mode)', (s) => ['base', 'base-alt', 'surface', 'main', 'main-accent', 'border-light', 'border-dark', 'link', 'primary', 'primary-hover', 'on-primary', 'selected', 'success-text', 'error-text', 'accent-text'].includes(s)],
    ['Brand yellow', (s) => /yellow/.test(s)],
    ['Ink & neutrals', (s) => /^(ink|black|white|gray)/.test(s)],
    ['Accents', (s) => /^(teal|plum)/.test(s)],
    ['Status', (s) => /^(success|warning|error|info)/.test(s) && !/-text$/.test(s)],
  ];
  return groups.map(([t, f]) => `<h3 class="ds-sub">${t}</h3><div class="ds-swatches">${P.filter((c) => f(c.slug)).map((c) => `<div class="swatch"><div class="swatch__chip" style="--c:var(--wp--preset--color--${c.slug})"></div><div class="swatch__meta"><b>${esc(c.name)}</b><code>${c.color}</code><code>--wp--preset--color--${c.slug}</code></div></div>`).join('')}</div>`).join('');
}
function dsTypeScale() {
  const sizes = ['huge', 'xx-large', 'x-large', 'large', 'medium', 'base', 'small'];

  return `<ul class="ds-scale">${sizes.map((s) => { const def = T.find((t) => t.slug === s); const head = ['huge', 'xx-large', 'x-large', 'large'].includes(s); return `<li><code>${s}</code><div><div class="ds-scale__sample" style="font-size:var(--wp--preset--font-size--${s});${head ? 'font-family:var(--wp--preset--font-family--heading);font-weight:600;line-height:1.1;letter-spacing:var(--wp--custom--letter-spacing--heading)' : ''}">${head ? 'Every child, every chance' : 'Your gift keeps a child learning all year.'}</div><small class="muted"><span data-px="${s}"></span> now · <code>${esc(def.size)}</code></small></div></li>`; }).join('')}</ul>`;
}
